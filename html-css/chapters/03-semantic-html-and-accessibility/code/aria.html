<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARIA patterns</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; line-height: 1.5; }
  button { font: inherit; padding: .3rem .7rem; border-radius: 6px; border: 1px solid #334155; background: #f8fafc; }
  .icon { width: 2.2rem; }
  .row { margin-bottom: .9rem; }
  #panel { border-left: 3px solid #2563eb; padding-left: .6rem; }
  nav a[aria-current="page"] { font-weight: 700; text-decoration: none; }
  .hint { color: #475569; font-size: .9rem; }
</style>
</head>
<body>
  <div class="row">
    1. Icon-only button:
    <button class="icon" type="button" aria-label="Close">✕</button>
  </div>
  <div class="row">
    2. <span id="cart-h">Shopping cart</span>:
    <button type="button" aria-labelledby="cart-h cart-n"><span id="cart-n">3 items</span></button>
  </div>
  <div class="row">
    3. <label for="pw">Password</label> <input id="pw" type="password" aria-describedby="pw-hint">
    <div id="pw-hint" class="hint">At least 12 characters.</div>
  </div>
  <div class="row">
    4. <button type="button" aria-expanded="true" aria-controls="panel" id="toggle">Shipping details</button>
    <div id="panel">Ships in 2 business days.</div>
  </div>
  <div class="row">
    5. <nav aria-label="Breadcrumb"><a href="/">Home</a> › <a href="/shop">Shop</a> › <a href="/shop/boots" aria-current="page">Boots</a></nav>
  </div>
  <div class="row">
    6. <button type="button" id="add">Add to cart</button>
    <span role="status" id="live"></span>
  </div>
  <div class="row">
    7. <span aria-hidden="true">★★★★☆</span><span class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap">Rated 4 out of 5</span> (stars hidden, text for screen readers)
  </div>
  <script>
    const t = document.getElementById('toggle'), p = document.getElementById('panel');
    t.addEventListener('click', () => { const open = t.getAttribute('aria-expanded') === 'true';
      t.setAttribute('aria-expanded', String(!open)); p.hidden = open; });
    document.getElementById('add').addEventListener('click', () => { document.getElementById('live').textContent = 'Added. Cart has 4 items.'; });
  </script>
</body>
</html>
