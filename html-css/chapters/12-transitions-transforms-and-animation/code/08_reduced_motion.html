<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Respecting prefers-reduced-motion</title>
<style>
  body { margin: 12px; font: 14px/1.4 system-ui, sans-serif; color: #1f2937; }
  .card { width: 220px; padding: 12px; border-radius: 10px; background: #eff6ff; border: 1px solid #bfdbfe; }
  .spinner { width: 20px; height: 20px; border: 4px solid #cbd5e1; border-top-color: #2563eb; border-radius: 50%; }
  html { scroll-behavior: auto; }

  /* Pattern 1 ("motion only when allowed"): big movement is added only for users with no preference */
  @keyframes slide-in { from { translate: -60px 0; opacity: 0; } }
  @media (prefers-reduced-motion: no-preference) {
    .card { animation: slide-in 600ms ease-out both; }
    html  { scroll-behavior: smooth; }
  }

  /* Pattern 2 (replace, don't remove): a spinner still needs to say "busy" — slow it and use a gentler effect */
  @keyframes spin { to { rotate: 1turn; } }
  @keyframes pulse { 50% { opacity: .35; } }
  .spinner { animation: spin 800ms linear infinite; }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: pulse 2s ease-in-out infinite; }
  }
</style>
</head>
<body>
<div class="card">New message from Priya</div>
<p><span class="spinner" style="display:inline-block;vertical-align:middle"></span> Loading…</p>
</body>
</html>
