<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lazy loading</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; color: #222; }
    img { display: block; border: 1px solid #ccc; }
    #report { position: fixed; top: 12px; right: 12px; background: #fffbe6; border: 1px solid #e0c200;
              padding: 8px 12px; font: 13px/1.5 ui-monospace, monospace; white-space: pre; }
    .far { margin-top: 3000px; }       /* pushes the lazy images far below the first screen */
  </style>
</head>
<body>
  <!-- Above the fold: the likely LCP image. Load it eagerly and ask for high priority. -->
  <img id="hero" src="media/hills-400.jpg" alt="Hero: hills at sunrise" width="400" height="267"
       fetchpriority="high">
  <p>Scroll down... the next images are ~3000px below.</p>

  <!-- Below the fold: let the browser fetch them only when the user scrolls near. -->
  <img id="lazy1" class="far" src="media/photo-800.jpg" alt="Grainy hills" width="400" height="267" loading="lazy">
  <img id="lazy2" src="media/hills-1600.jpg" alt="Large hills" width="400" height="267" loading="lazy">

  <div id="report"></div>
  <script>
    // After the page's load event, report which images have actually been downloaded.
    addEventListener('load', () => {
      report.textContent = 'after the load event:\n' + [...document.images]
        .map(i => `${i.id.padEnd(6)} ${(i.getAttribute('loading') || '(none)').padEnd(6)} ${i.naturalWidth ? 'LOADED' : 'not loaded yet'}`)
        .join('\n');
    });
  </script>
</body>
</html>
