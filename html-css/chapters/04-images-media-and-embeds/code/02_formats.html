<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Image formats compared</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; color: #222; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    figure { margin: 0; }
    img { width: 100%; height: auto; display: block; border: 1px solid #ccc; }
    figcaption { font-size: 13px; }
    h3 { margin: 14px 0 6px; }
  </style>
</head>
<body>
  <!-- Same picture, four formats. Sizes come from format_sizes.mjs. -->
  <h3>Flat graphic (few colours, sharp edges)</h3>
  <div class="grid">
    <figure><img src="media/hills-800.png" alt="" width="800" height="533"><figcaption>PNG — 8.8 KB</figcaption></figure>
    <figure><img src="media/hills-800.jpg" alt="" width="800" height="533"><figcaption>JPG — 19.1 KB</figcaption></figure>
    <figure><img src="media/hills-800.webp" alt="" width="800" height="533"><figcaption>WEBP — 7.4 KB</figcaption></figure>
    <figure><img src="media/hills-800.avif" alt="" width="800" height="533"><figcaption>AVIF — 4.3 KB</figcaption></figure>
  </div>
  <h3>Photo-like (fine grain, many colours)</h3>
  <div class="grid">
    <figure><img src="media/photo-800.png" alt="" width="800" height="533"><figcaption>PNG — 508.2 KB</figcaption></figure>
    <figure><img src="media/photo-800.jpg" alt="" width="800" height="533"><figcaption>JPG — 106.8 KB</figcaption></figure>
    <figure><img src="media/photo-800.webp" alt="" width="800" height="533"><figcaption>WEBP — 106.3 KB</figcaption></figure>
    <figure><img src="media/photo-800.avif" alt="" width="800" height="533"><figcaption>AVIF — 73.7 KB</figcaption></figure>
  </div>
</body>
</html>
