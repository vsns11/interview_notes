<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Card — Tailwind CSS v4</title>
<link rel="stylesheet" href="08_tailwind.out.css">
<body class="m-4 flex gap-3 text-[15px] leading-snug text-slate-900">
  <article class="w-[170px] rounded-xl border border-slate-300 bg-white p-3.5">
    <h3 class="text-base font-bold">Trail shoes</h3>
    <p class="mt-1 mb-3 text-slate-600">$89</p>
    <button class="w-full rounded-lg bg-brand p-2 text-white hover:bg-brand-dark">Add to cart</button>
  </article>
  <article class="w-[170px] rounded-xl border-2 border-amber-500 bg-amber-50 p-3.5">
    <h3 class="text-base font-bold">Rain jacket</h3>
    <p class="mt-1 mb-3 text-slate-600">$129</p>
    <button class="w-full rounded-lg bg-amber-600 p-2 text-white hover:bg-amber-700">Add to cart</button>
  </article>
</body>
</html>
