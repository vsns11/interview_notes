<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backgrounds and gradients</title>
<style>
  body { margin: 12px; font: 14px/1.4 system-ui, sans-serif; color: #1f2937; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  figure { margin: 0; }
  figcaption { font: 600 11px/1.3 ui-monospace, monospace; color: #7c3aed; margin-top: 4px; }
  .box { height: 110px; border-radius: 8px; border: 1px solid #0002; }

  .lin     { background: linear-gradient(to right, #3b82f6, #a855f7); }
  .angle   { background: linear-gradient(135deg, #f59e0b 0%, #ef4444 50%, #7c3aed 100%); }
  .hard    { background: linear-gradient(to right, #22c55e 50%, #e5e7eb 50%); }          /* hard stop = no blend */
  .stripes { background: repeating-linear-gradient(45deg, #fde68a 0 10px, #f59e0b 10px 20px); }
  .radial  { background: radial-gradient(circle at 30% 30%, #fff 0 8%, #60a5fa 40%, #1e3a8a); }
  .conic   { background: conic-gradient(#3b82f6 0 40%, #22c55e 0 70%, #f59e0b 0); border-radius: 50%; width: 110px; }
  .srgb    { background: linear-gradient(to right, blue, yellow); }                        /* default: sRGB (via grey) */
  .oklch   { background: linear-gradient(in oklch to right, blue, yellow); }               /* interpolate in OKLCH */

  /* Several layers: text-legibility gradient ON TOP of a photo (first layer = top) */
  .layers  { background:
               linear-gradient(to top, rgb(0 0 0 / .75), transparent 60%),
               url("media/hills-800.jpg") center / cover no-repeat;
             color: #fff; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box; font-weight: 700; }
  .cover   { background: #e0f2fe url("media/hills-800.jpg") center / cover no-repeat; }
  .contain { background: #e0f2fe url("media/hills-800.jpg") center / contain no-repeat; }
  .cliptext { background: linear-gradient(90deg, #2563eb, #db2777); background-clip: text; -webkit-background-clip: text;
              color: transparent; font: 900 34px/110px system-ui, sans-serif; border: 0; text-align: center; }
</style>
</head>
<body>
<div class="grid">
  <figure><div class="box lin"></div><figcaption>linear-gradient(to right, …)</figcaption></figure>
  <figure><div class="box angle"></div><figcaption>135deg, 3 colour stops</figcaption></figure>
  <figure><div class="box hard"></div><figcaption>hard stop: #22c55e 50%, #e5e7eb 50%</figcaption></figure>
  <figure><div class="box stripes"></div><figcaption>repeating-linear-gradient</figcaption></figure>
  <figure><div class="box radial"></div><figcaption>radial-gradient(circle at 30% 30%, …)</figcaption></figure>
  <figure><div class="box conic"></div><figcaption>conic-gradient: a pie chart</figcaption></figure>
  <figure><div class="box srgb"></div><figcaption>blue → yellow, default (sRGB)</figcaption></figure>
  <figure><div class="box oklch"></div><figcaption>blue → yellow, in oklch</figcaption></figure>
  <figure><div class="box layers">Caption over photo</div><figcaption>2 layers: gradient over image</figcaption></figure>
  <figure><div class="box cover"></div><figcaption>background-size: cover</figcaption></figure>
  <figure><div class="box contain"></div><figcaption>background-size: contain</figcaption></figure>
  <figure><div class="box cliptext">Gradient</div><figcaption>background-clip: text</figcaption></figure>
</div>
</body>
</html>
