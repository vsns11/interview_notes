<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>styling approaches</title>
<link rel="stylesheet" href="tailwind.css"><link rel="stylesheet" href="gallery.bundle.css">
<style>
  body { font-family: system-ui, sans-serif; background: #f6f8fa; margin: 0; padding: 20px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  figure { margin: 0; } figcaption { font: 600 13px system-ui; color: #57606a; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
</style></head>
<body><div id="root"></div><script src="gallery.bundle.js"></script></body></html>
