<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>virtual list</title>
<style>
  body { font: 15px system-ui, sans-serif; background: #f6f7f9; margin: 24px; color: #1d2330; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .viewport { width: 420px; background: #fff; border: 1px solid #cfd5df; border-radius: 8px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid #eef0f4; box-sizing: border-box; }
  .idx { width: 48px; color: #8a93a3; font-variant-numeric: tabular-nums; }
  .city { margin-left: auto; color: #4a6fa5; }
  #stat { margin-top: 12px; padding: 8px 12px; background: #e8f3ea; border: 1px solid #9fcca8; border-radius: 6px; display: inline-block; }
</style></head>
<body><h1>Virtualized list (hand-rolled windowing)</h1><div id="root"></div><div id="stat">...</div>
<script src="virtual.bundle.js"></script></body></html>
