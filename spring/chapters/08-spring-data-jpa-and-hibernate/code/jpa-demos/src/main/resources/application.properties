spring.main.banner-mode=off
# no spring.datasource.url: Boot creates an embedded H2 with a unique name per application context
spring.jpa.hibernate.ddl-auto=create-drop
# run data.sql AFTER Hibernate created the tables
spring.jpa.defer-datasource-initialization=true
# count statements (Hibernate Statistics) and record their SQL text (StatementInspector)
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session_factory.statement_inspector=ch08.jpa.support.SqlRecorder
