spring.datasource.url=jdbc:h2:mem:ch14events;DB_CLOSE_DELAY=-1
spring.sql.init.mode=always
spring.main.banner-mode=off
# the auto-configured @Async executor (a ThreadPoolTaskExecutor unless virtual threads are on)
spring.task.execution.thread-name-prefix=task-
spring.task.execution.pool.core-size=4
