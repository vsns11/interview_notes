spring.main.banner-mode=off
# Local development values; in tests @ServiceConnection overrides them with the containers' addresses
spring.mongodb.uri=mongodb://localhost:27017/shop
spring.data.mongodb.auto-index-creation=true
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Only this cache exists. (spring.cache.redis.time-to-live etc. would set defaults, but they are
# ignored here because RedisCacheSetup defines its own RedisCacheConfiguration bean.)
spring.cache.cache-names=products,prices
