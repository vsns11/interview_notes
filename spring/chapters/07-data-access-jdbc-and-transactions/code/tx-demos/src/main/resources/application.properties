# The book's private PostgreSQL 14 (see tools_pg.sh). The test run creates and drops this database.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5544/spring_ch07_tx
spring.datasource.username=postgres
spring.datasource.hikari.maximum-pool-size=5
# not an embedded database, so schema.sql only runs when asked
spring.sql.init.mode=always
spring.main.banner-mode=off
