spring.application.name=orders
# --- which actuator endpoints are reachable over HTTP (default: only health)
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers
# --- health: show component details to authorized users only
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=OPS
# a custom group used by, e.g., a load balancer or a deployment check
management.endpoint.health.group.deploy.include=ping,inventory
management.endpoint.health.group.deploy.show-details=always
# readiness should also fail when inventory is down
management.endpoint.health.group.readiness.include=readinessState,inventory
# --- info endpoint contributors (env, java, os, process are off by default)
management.info.env.enabled=true
management.info.java.enabled=true
info.app.description=Orders demo for chapter 15
# --- metrics: a common tag added to every meter
management.metrics.tags.region=eu-west-1
# --- tracing: sample every request (default 0.1 = 10%)
management.tracing.sampling.probability=1.0
# --- @Observed / @Timed / @Counted need this
management.observations.annotations.enabled=true
# --- demo user for the protected endpoints (never do this in production)
spring.security.user.name=ops
spring.security.user.password=ops-secret
spring.security.user.roles=OPS
# --- don't create spans/metrics for every Spring Security filter step (noise in this demo)
management.observations.enable.spring.security=false
