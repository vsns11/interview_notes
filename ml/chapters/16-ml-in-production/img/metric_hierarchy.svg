<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="576" viewBox="0 0 1240 576" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Primary decides, guardrails veto, diagnostics explain">
  <defs>
    <marker id="m2l5bb-mpink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <filter id="m2l5bb-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m2l5bb-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m2l5bb-k1"><rect x="180" y="70" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="m2l5bb-k2"><rect x="180" y="200" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="m2l5bb-k3"><rect x="180" y="330" width="340" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="576" fill="#FFFFFF"/>

  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M180,245 H140 Q128,245 128,233 V127 Q128,115 140,115 H180" marker-end="url(#m2l5bb-mpink)"/></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="128" y="180" fill="#BE185D">can veto</text></g>
  <g filter="url(#m2l5bb-soft)">
    <rect x="180" y="70" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="180" y="70" width="6" height="90" fill="#059669" clip-path="url(#m2l5bb-k1)"/>
  </g>
  <circle cx="218" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,104.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="244" y="122" font-size="18.5" font-weight="600" fill="#111827">1. Primary</text>
  <text x="550" y="121" font-size="15.5" fill="#6B7280">the one metric that decides ship or not, chosen in advance</text>
  <g filter="url(#m2l5bb-soft)">
    <rect x="180" y="200" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="180" y="200" width="6" height="90" fill="#DB2777" clip-path="url(#m2l5bb-k2)"/>
  </g>
  <circle cx="218" cy="245" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,234.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="244" y="252" font-size="18.5" font-weight="600" fill="#111827">2. Guardrails</text>
  <text x="550" y="251" font-size="15.5" fill="#6B7280">must not get worse: latency, revenue, crashes, fairness</text>
  <g filter="url(#m2l5bb-soft)">
    <rect x="180" y="330" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="180" y="330" width="6" height="90" fill="#64748B" clip-path="url(#m2l5bb-k3)"/>
  </g>
  <circle cx="218" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,364.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="244" y="382" font-size="18.5" font-weight="600" fill="#111827">3. Diagnostics</text>
  <text x="550" y="381" font-size="15.5" fill="#6B7280">explain why the primary moved, so a win is understood</text>
  <rect x="40" y="460" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="505" text-anchor="middle" font-size="16" fill="#475569">Decide the hierarchy before the test runs, so a disagreement between two metrics already has an answer.</text>
