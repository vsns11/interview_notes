<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="672" viewBox="0 0 1240 672" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The precompute then rerank hybrid">
  <defs>
