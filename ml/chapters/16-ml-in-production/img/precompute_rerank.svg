  <rect x="40" y="556" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="601" text-anchor="middle" font-size="16" fill="#475569">Prepare candidates in advance, then rerank using live context. Measure freshness and total cost.</text>
