<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="492" viewBox="0 0 1240 492" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The feedback loop that biases the training data">
  <defs>
    <marker id="m2l5c-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="m2l5c-mpink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <filter id="m2l5c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m2l5c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m2l5c-k1"><rect x="50" y="64" width="193" height="90" rx="12"/></clipPath>
    <clipPath id="m2l5c-k2"><rect x="286" y="64" width="286" height="90" rx="12"/></clipPath>
    <clipPath id="m2l5c-k3"><rect x="615" y="64" width="214" height="90" rx="12"/></clipPath>
    <clipPath id="m2l5c-k4"><rect x="872" y="64" width="317" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="492" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M243,109 L286,109" marker-end="url(#m2l5c-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M572,109 L615,109" marker-end="url(#m2l5c-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M829,109 L872,109" marker-end="url(#m2l5c-mslate)"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M1189,109 H1205 Q1217,109 1217,121 V236 Q1217,248 1205,248 H158 Q146,248 146,236 V154" marker-end="url(#m2l5c-mpink)"/></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="683" y="254" fill="#BE185D">the loop narrows itself</text></g>
  <g filter="url(#m2l5c-soft)">
    <rect x="50" y="64" width="193" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="50" y="64" width="6" height="90" fill="#2563EB" clip-path="url(#m2l5c-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">Model ranks</text>
  <g filter="url(#m2l5c-soft)">
    <rect x="286" y="64" width="286" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="286" y="64" width="6" height="90" fill="#2563EB" clip-path="url(#m2l5c-k2)"/>
  </g>
  <circle cx="324" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(313.56,98.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="350" y="116" font-size="18.5" font-weight="600" fill="#111827">User sees only those</text>
  <text x="429" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">only what was shown</text>
  <g filter="url(#m2l5c-soft)">
    <rect x="615" y="64" width="214" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="615" y="64" width="6" height="90" fill="#059669" clip-path="url(#m2l5c-k3)"/>
  </g>
  <circle cx="653" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(642.56,98.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="679" y="116" font-size="18.5" font-weight="600" fill="#111827">Clicks logged</text>
  <text x="722" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">biased by definition</text>
  <g filter="url(#m2l5c-soft)">
    <rect x="872" y="64" width="317" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="872" y="64" width="6" height="90" fill="#7C3AED" clip-path="url(#m2l5c-k4)"/>
  </g>
  <circle cx="910" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(899.56,98.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="936" y="116" font-size="18.5" font-weight="600" fill="#111827">Retrain on those clicks</text>
  <text x="1030.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">learns what we showed</text>
  <rect x="40" y="300" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="334" font-size="16" fill="#475569">The model shapes the very data it will later retrain on.</text>
  <rect x="64" y="360" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="382" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The trap</text>
  <text x="288" y="382" font-size="15.5" fill="#475569">the model only ever learns from what it chose to show</text>
  <rect x="64" y="404" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="426" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Exploration</text>
  <text x="288" y="426" font-size="15.5" fill="#475569">risk-approved sampling can improve coverage; account for remaining bias</text>
</svg>