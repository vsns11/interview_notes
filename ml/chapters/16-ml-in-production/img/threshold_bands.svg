<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="536" viewBox="0 0 1240 536" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two thresholds cut one score into approve, review and block">
  <defs>

    <filter id="m2l4bb-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m2l4bb-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="536" fill="#FFFFFF"/>
  <rect x="120" y="140" width="400" height="60" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="520" y="140" width="300" height="60" rx="0" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="820" y="140" width="300" height="60" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
  <g stroke="#64748B" stroke-width="2.5" fill="none"><path d="M520,120 V220"/><path d="M820,120 V220"/></g>

  <text x="520" y="108" font-size="15.5" font-weight="600" text-anchor="middle" fill="#475569">threshold 1</text>
  <text x="820" y="108" font-size="15.5" font-weight="600" text-anchor="middle" fill="#475569">threshold 2</text>
  <text x="320" y="178" font-size="18.5" font-weight="600" text-anchor="middle" fill="#047857">Approve</text>
  <text x="670" y="178" font-size="18.5" font-weight="600" text-anchor="middle" fill="#B45309">Review</text>
  <text x="970" y="178" font-size="18.5" font-weight="600" text-anchor="middle" fill="#BE185D">Block</text>
  <text x="120" y="240" font-size="15.5" fill="#64748B">model score 0</text>
  <text x="1120" y="240" text-anchor="end" font-size="15.5" fill="#64748B">1</text>
  <rect x="40" y="300" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="334" font-size="16" fill="#475569">The model only produces a score. Where you cut it is a policy decision, not a modeling one.</text>
  <rect x="64" y="360" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="382" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Move a cut left</text>
  <text x="288" y="382" font-size="15.5" fill="#475569">more recall: you catch more fraud, and block more good customers</text>
  <rect x="64" y="404" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="426" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Move a cut right</text>
  <text x="288" y="426" font-size="15.5" fill="#475569">more precision: fewer false alarms, and more fraud gets through</text>
  <rect x="64" y="448" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="470" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Who decides</text>
  <text x="288" y="470" font-size="15.5" fill="#475569">product or risk, because the cut prices one error against the other</text>
</svg>