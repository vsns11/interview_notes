<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An inverted index cannot hold a photo; a shared embedding space can">
  <defs>

    <filter id="m8l4a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m8l4a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m8l4a-k1"><rect x="50" y="70" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="m8l4a-k2"><rect x="650" y="70" width="540" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>


  <g filter="url(#m8l4a-soft)">
    <rect x="50" y="70" width="540" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="50" y="70" width="6" height="90" fill="#64748B" clip-path="url(#m8l4a-k1)"/>
  </g>
  <circle cx="88" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,104.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="114" y="122" font-size="18.5" font-weight="600" fill="#111827">Inverted index</text>
  <text x="320" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">a lookup table from each word to its documents</text>
  <text x="320" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">searches captions or tags, not full visual meaning</text>
  <g filter="url(#m8l4a-lift)">
    <rect x="650" y="70" width="540" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="650" y="70" width="9" height="90" fill="#059669" clip-path="url(#m8l4a-k2)"/>
  </g>
  <circle cx="688" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,104.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="714" y="122" font-size="18.5" font-weight="600" fill="#111827">Shared embedding space</text>
  <text x="920" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">one set of coordinates for images and text alike</text>
  <text x="920" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">things that mean the same sit near each other</text>
  <rect x="40" y="280" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="314" font-size="16" fill="#475569">Image preparation and compatible encoders feed retrieval, filtering, and ranking.</text>
  <rect x="64" y="340" width="200" height="32" rx="9" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="164" y="362" text-anchor="middle" font-size="15.5" font-weight="600" fill="#4338CA">Photo query</text>
  <text x="288" y="362" font-size="15.5" fill="#475569">encode the photo, find the listings nearest to it in that space</text>
  <rect x="64" y="384" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="406" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Text query</text>
  <text x="288" y="406" font-size="15.5" fill="#475569">encode text in the same space; filter to the user's saved items</text>
  <rect x="64" y="428" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="450" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">What it really is</text>
  <text x="288" y="450" font-size="15.5" fill="#475569">the search funnel, where the query happens to be an image instead of words</text>
  <rect x="40" y="526" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="571" text-anchor="middle" font-size="16" fill="#475569">Nothing here generates a word. This is prediction and retrieval, start to finish.</text>
</svg>