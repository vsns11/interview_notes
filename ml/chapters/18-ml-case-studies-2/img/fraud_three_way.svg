  <circle cx="972" cy="285" r="18" fill="#FFFFFF"/>
  <g transform="translate(961.56,274.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="998" y="292" font-size="18.5" font-weight="600" fill="#111827">Step up, or block</text>
  <text x="1061.5" y="355" font-size="15.5" text-anchor="middle" fill="#6B7280">action follows risk policy</text>
  <rect x="40" y="400" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="445" text-anchor="middle" font-size="16" fill="#475569">Use evidence, expected loss, policy, and review capacity. Human review needs a separate workflow.</text>
</svg>