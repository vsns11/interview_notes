  </g>
  <circle cx="518" cy="101" r="18" fill="#FFFFFF"/>
  <g transform="translate(507.56,90.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="544" y="108" font-size="18.5" font-weight="600" fill="#111827">One fraud score</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="135" y="186" fill="#047857">below the low line</text></g>
