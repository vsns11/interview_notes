<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The decision is three-way, set by two thresholds">
  <defs>
    <marker id="m3l5a-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
