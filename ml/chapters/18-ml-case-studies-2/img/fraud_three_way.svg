    <clipPath id="m3l5a-k1"><rect x="480" y="56" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="m3l5a-k2"><rect x="50" y="240" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="m3l5a-k3"><rect x="475" y="240" width="204" height="90" rx="12"/></clipPath>
    <clipPath id="m3l5a-k4"><rect x="934" y="240" width="255" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="570" fill="#FFFFFF"/>

  <g fill="none" stroke="#059669" stroke-width="2"><path d="M620,146 V180 Q620,192 608,192 H147 Q135,192 135,204 V240" marker-end="url(#m3l5a-memerald)"/></g>
  <g fill="none" stroke="#D97706" stroke-width="2"><path d="M620,146 V180 Q620,192 608,192 H589 Q577,192 577,204 V240" marker-end="url(#m3l5a-mamber)"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M620,146 V180 Q620,192 632,192 H1049.5 Q1061.5,192 1061.5,204 V240" marker-end="url(#m3l5a-mpink)"/></g>
  <g filter="url(#m3l5a-lift)">
