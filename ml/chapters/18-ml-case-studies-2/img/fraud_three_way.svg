  </g>
  <circle cx="88" cy="285" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,274.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="292" font-size="18.5" font-weight="600" fill="#111827">Approve</text>
  <text x="135" y="355" font-size="15.5" text-anchor="middle" fill="#6B7280">the vast majority, untouched</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="577" y="186" fill="#B45309">between the lines</text></g>
