  <circle cx="513" cy="285" r="18" fill="#FFFFFF"/>
  <g transform="translate(502.56,274.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="539" y="292" font-size="18.5" font-weight="600" fill="#111827">Further checks</text>
  <text x="577" y="355" font-size="15.5" text-anchor="middle" fill="#6B7280">challenge or supported review</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="1061.5" y="186" fill="#BE185D">above the high line</text></g>
