<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two budgets: reviewer hours and compute">
  <defs>

    <filter id="m8l3c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m8l3c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m8l3c-k1"><rect x="50" y="70" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="m8l3c-k2"><rect x="650" y="70" width="540" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>


  <g filter="url(#m8l3c-lift)">
    <rect x="50" y="70" width="540" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="50" y="70" width="9" height="90" fill="#DB2777" clip-path="url(#m8l3c-k1)"/>
  </g>
  <circle cx="88" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,104.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="114" y="122" font-size="18.5" font-weight="600" fill="#111827">Reviewer hours</text>
  <text x="320" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">0.1 percent of 200M uploads is 200,000 a day</text>
  <text x="320" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">a few hundred decisions per reviewer-day</text>
  <g filter="url(#m8l3c-soft)">
    <rect x="650" y="70" width="540" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="650" y="70" width="6" height="90" fill="#2563EB" clip-path="url(#m8l3c-k2)"/>
  </g>
  <circle cx="688" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,104.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="714" y="122" font-size="18.5" font-weight="600" fill="#111827">Compute</text>
  <text x="920" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">volume, media length, pass rate, and model cost</text>
  <text x="920" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">the heavy stage only sees the flagged slice</text>
  <rect x="40" y="280" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="314" font-size="16" fill="#475569">Both budgets are real money, and only one of them is measured in GPUs.</text>
  <rect x="64" y="340" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="362" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The hard limit</text>
  <text x="288" y="362" font-size="15.5" fill="#475569">thresholds are effectively a headcount setting, so the queue must respect capacity</text>
  <rect x="64" y="384" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="406" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">The loud failure</text>
  <text x="288" y="406" font-size="15.5" fill="#475569">the viral miss; its defenses are priced out and paid for in extra false flags</text>
  <rect x="64" y="428" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="450" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">The quiet failure</text>
  <text x="288" y="450" font-size="15.5" fill="#475569">monitor incorrect removals through appeals and representative audits</text>
  <rect x="40" y="526" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="571" text-anchor="middle" font-size="16" fill="#475569">Every policy change also triggers a batch re-scan of the back catalog.</text>
</svg>