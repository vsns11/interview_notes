<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three signal sources and what each does at cold start">
  <defs>

    <filter id="m8l2b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m8l2b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m8l2b-k1"><rect x="50" y="70" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="m8l2b-k2"><rect x="440" y="70" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="m8l2b-k3"><rect x="830" y="70" width="360" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>


  <g filter="url(#m8l2b-soft)">
    <rect x="50" y="70" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="50" y="70" width="6" height="90" fill="#2563EB" clip-path="url(#m8l2b-k1)"/>
  </g>
  <circle cx="88" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,104.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="114" y="122" font-size="18.5" font-weight="600" fill="#111827">Collaborative</text>
  <text x="230" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">who listens with whom</text>
  <text x="230" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">interaction history; limited for new tracks</text>
  <g filter="url(#m8l2b-lift)">
    <rect x="440" y="70" width="360" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="440" y="70" width="9" height="90" fill="#059669" clip-path="url(#m8l2b-k2)"/>
  </g>
  <circle cx="478" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,104.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.9L18.8 9.8l-4.9 1.9L12 16.6l-1.9-4.9L5.2 9.8l4.9-1.9z"/><path d="M18.5 15.5l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z"/></g>
  <text x="504" y="122" font-size="18.5" font-weight="600" fill="#111827">Audio content</text>
  <text x="620" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">tempo, timbre, mood, from raw audio</text>
  <text x="620" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">works from day zero</text>
  <g filter="url(#m8l2b-soft)">
    <rect x="830" y="70" width="360" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="830" y="70" width="6" height="90" fill="#4F46E5" clip-path="url(#m8l2b-k3)"/>
  </g>
  <circle cx="868" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(857.56,104.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="894" y="122" font-size="18.5" font-weight="600" fill="#111827">Text and metadata</text>
  <text x="1010" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">genre tags, playlists, editorial</text>
  <text x="1010" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">works from day zero</text>
  <rect x="40" y="268" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="302" font-size="16" fill="#475569">Cold start is exactly why this trio matters, and it is the strongest content-features story in the course.</text>
  <rect x="64" y="328" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="350" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Cold start</text>
  <text x="288" y="350" font-size="15.5" fill="#475569">the system has no history yet for a user or a track</text>
  <rect x="64" y="372" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="394" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Not an edge case</text>
  <text x="288" y="394" font-size="15.5" fill="#475569">new uploads make cold start a regular workload</text>
  <rect x="64" y="416" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="438" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The answer</text>
  <text x="288" y="438" font-size="15.5" fill="#475569">a brand-new track with zero plays still retrieves, through audio similarity alone</text>
  <rect x="40" y="484" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="529" text-anchor="middle" font-size="16" fill="#475569">Early skips arrive quickly, but their meaning depends on the session.</text>
</svg>