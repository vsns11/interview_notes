<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Reach-aware re-scoring: scrutiny grows with the audience">
  <defs>
    <marker id="m8l3b-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
