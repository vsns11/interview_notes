  <circle cx="958" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(947.56,98.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="984" y="116" font-size="18.5" font-weight="600" fill="#111827">1M views</text>
  <text x="1055" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">the full multimodal pass</text>
  <rect x="40" y="240" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="274" font-size="16" fill="#475569">Every item that crosses a view tier gets re-scored by heavier models than it saw at upload.</text>
  <rect x="64" y="300" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="322" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Why it is cheap</text>
  <text x="288" y="322" font-size="15.5" fill="#475569">viral content is rare by definition, so few items ever climb the tiers</text>
  <rect x="64" y="344" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="366" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">The review queue</text>
  <text x="288" y="366" font-size="15.5" fill="#475569">severity, reach, uncertainty, deadlines, and audits</text>
  <rect x="64" y="388" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="410" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">The action ladder</text>
  <text x="288" y="410" font-size="15.5" fill="#475569">remove, reduce meaning stop amplifying, age-gate, warn</text>
  <rect x="40" y="468" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="513" text-anchor="middle" font-size="16" fill="#475569">Rescoring reduces exposure risk, but repeated misses remain possible.</text>
</svg>