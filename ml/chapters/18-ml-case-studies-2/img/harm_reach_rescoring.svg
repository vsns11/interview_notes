      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m8l3b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m8l3b-k1"><rect x="50" y="64" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="m8l3b-k2"><rect x="340" y="64" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="m8l3b-k3"><rect x="630" y="64" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="m8l3b-k4"><rect x="920" y="64" width="270" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M320,109 L340,109" marker-end="url(#m8l3b-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M610,109 L630,109" marker-end="url(#m8l3b-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M900,109 L920,109" marker-end="url(#m8l3b-mslate)"/></g>
  <g filter="url(#m8l3b-soft)">
    <rect x="50" y="64" width="270" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="50" y="64" width="6" height="90" fill="#64748B" clip-path="url(#m8l3b-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">At upload</text>
  <text x="185" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">the cheap funnel runs</text>
  <g filter="url(#m8l3b-soft)">
    <rect x="340" y="64" width="270" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="340" y="64" width="6" height="90" fill="#2563EB" clip-path="url(#m8l3b-k2)"/>
  </g>
  <circle cx="378" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,98.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="404" y="116" font-size="18.5" font-weight="600" fill="#111827">10K views</text>
  <text x="475" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">re-scored, heavier</text>
  <g filter="url(#m8l3b-soft)">
    <rect x="630" y="64" width="270" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="630" y="64" width="6" height="90" fill="#D97706" clip-path="url(#m8l3b-k3)"/>
  </g>
  <circle cx="668" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(657.56,98.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="694" y="116" font-size="18.5" font-weight="600" fill="#111827">100K views</text>
  <text x="765" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">re-scored, heavier still</text>
  <g filter="url(#m8l3b-lift)">
    <rect x="920" y="64" width="270" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="920" y="64" width="9" height="90" fill="#DB2777" clip-path="url(#m8l3b-k4)"/>
