<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="576" viewBox="0 0 1240 576" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three layers of metric, because acceptance alone is a trap">
  <defs>
