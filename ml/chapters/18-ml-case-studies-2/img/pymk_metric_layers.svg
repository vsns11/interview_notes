  </g>
  <circle cx="218" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,364.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="244" y="382" font-size="18.5" font-weight="600" fill="#111827">Long-term</text>
  <text x="550" y="381" font-size="15.5" fill="#6B7280">downstream interaction between newly connected pairs</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="128" y="180" fill="#BE185D">can veto</text></g>
  <rect x="40" y="460" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="505" text-anchor="middle" font-size="16" fill="#475569">Acceptance is not the whole goal. Measure useful interactions and unwanted invitations too.</text>
