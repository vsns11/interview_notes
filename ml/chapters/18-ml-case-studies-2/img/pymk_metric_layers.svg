    <clipPath id="m3l7a-k3"><rect x="180" y="330" width="340" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="576" fill="#FFFFFF"/>

  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M180,245 H140 Q128,245 128,233 V127 Q128,115 140,115 H180" marker-end="url(#m3l7a-mpink)"/></g>
  <g filter="url(#m3l7a-soft)">
