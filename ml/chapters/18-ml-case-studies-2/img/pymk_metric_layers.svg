  </g>
  <circle cx="218" cy="245" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,234.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="244" y="252" font-size="18.5" font-weight="600" fill="#111827">Guardrails</text>
  <text x="550" y="251" font-size="15.5" fill="#6B7280">ignore rate, and "I do not know this person" reports</text>
  <g filter="url(#m3l7a-soft)">
    <rect x="180" y="330" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
