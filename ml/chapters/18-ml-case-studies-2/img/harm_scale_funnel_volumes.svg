<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The risk funnel, with the volume said out loud at every stage">
  <defs>

    <filter id="m8l3a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m8l3a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>


  <rect x="100" y="64" width="1040" height="62" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="620" y="101" text-anchor="middle" font-size="18" font-weight="600" fill="#475569">Hashes and hard rules</text>
  <text x="620" y="150" font-size="16" font-weight="600" text-anchor="middle" fill="#475569">200M items a day</text>
  <text x="620" y="172" font-size="15.5" text-anchor="middle" fill="#94A3B8">known-content matching with measured cost</text>
  <rect x="240" y="216" width="760" height="62" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="620" y="253" text-anchor="middle" font-size="18" font-weight="600" fill="#1D4ED8">Fast per-modality classifiers</text>
  <text x="620" y="302" font-size="16" font-weight="600" text-anchor="middle" fill="#1D4ED8">200M a day, about 2,300 a second</text>
  <text x="620" y="324" font-size="15.5" text-anchor="middle" fill="#94A3B8">small models, strict budgets</text>
  <rect x="390" y="368" width="460" height="62" rx="8" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="620" y="405" text-anchor="middle" font-size="18" font-weight="600" fill="#BE185D">Heavy multimodal models</text>
  <text x="620" y="454" font-size="16" font-weight="600" text-anchor="middle" fill="#BE185D">2M a day, about 23 a second</text>
  <text x="620" y="476" font-size="15.5" text-anchor="middle" fill="#94A3B8">only ever sees the flagged 1 percent</text>
  <rect x="40" y="534" width="1160" height="108" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="568" font-size="16" fill="#475569">The flag rate controls the compute bill. Quoting that number out loud is what correct sizing sounds like.</text>
  <rect x="64" y="594" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="616" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">The dial</text>
  <text x="288" y="616" font-size="15.5" fill="#475569">every extra tenth of a point on the flag rate is 200,000 more heavy inferences a day</text>
</svg>