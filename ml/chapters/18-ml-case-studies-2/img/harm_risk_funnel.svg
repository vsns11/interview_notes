<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The risk funnel spends compute in proportion to risk">
  <defs>
    <marker id="m3l6b-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="m3l6b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m3l6b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m3l6b-k1"><rect x="50" y="64" width="255" height="90" rx="12"/></clipPath>
    <clipPath id="m3l6b-k2"><rect x="341" y="64" width="265" height="90" rx="12"/></clipPath>
    <clipPath id="m3l6b-k3"><rect x="642" y="64" width="276" height="90" rx="12"/></clipPath>
    <clipPath id="m3l6b-k4"><rect x="954" y="64" width="235" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M305,109 L341,109" marker-end="url(#m3l6b-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M606,109 L642,109" marker-end="url(#m3l6b-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M918,109 L954,109" marker-end="url(#m3l6b-mslate)"/></g>
  <g filter="url(#m3l6b-soft)">
    <rect x="50" y="64" width="255" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="50" y="64" width="6" height="90" fill="#64748B" clip-path="url(#m3l6b-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">1. Hash and rules</text>
  <text x="177.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">known-content checks</text>
  <text x="177.5" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">all traffic</text>
  <g filter="url(#m3l6b-soft)">
    <rect x="341" y="64" width="265" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="341" y="64" width="6" height="90" fill="#2563EB" clip-path="url(#m3l6b-k2)"/>
  </g>
  <circle cx="379" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(368.56,98.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="405" y="116" font-size="18.5" font-weight="600" fill="#111827">2. Fast classifier</text>
  <text x="473.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">runs on every item</text>
  <text x="473.5" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">all traffic</text>
  <g filter="url(#m3l6b-soft)">
    <rect x="642" y="64" width="276" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="642" y="64" width="6" height="90" fill="#7C3AED" clip-path="url(#m3l6b-k3)"/>
  </g>
  <circle cx="680" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(669.56,98.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="706" y="116" font-size="18.5" font-weight="600" fill="#111827">3. Heavy multimodal</text>
  <text x="780" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">only the flagged slice</text>
  <text x="780" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">example: 1%</text>
  <g filter="url(#m3l6b-soft)">
    <rect x="954" y="64" width="235" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="954" y="64" width="6" height="90" fill="#059669" clip-path="url(#m3l6b-k4)"/>
  </g>
  <circle cx="992" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(981.56,98.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="1018" y="116" font-size="18.5" font-weight="600" fill="#111827">4. Human review</text>
  <text x="1071.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">borderline and appealed</text>
  <text x="1071.5" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">a fraction of that</text>
  <rect x="40" y="280" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="314" font-size="16" fill="#475569">It filters for risk, not relevance. It is a cost-management structure, not one model.</text>
  <rect x="64" y="340" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="362" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The arithmetic</text>
  <text x="288" y="362" font-size="15.5" fill="#475569">escalating 1% gives 1% of the all-traffic heavy-model cost</text>
  <rect x="64" y="384" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="406" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The worst failure</text>
  <text x="288" y="406" font-size="15.5" fill="#475569">a viral miss: harm reaching millions before anyone looks</text>
</svg>