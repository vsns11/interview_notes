  <g transform="translate(650.56,98.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="687" y="116" font-size="18.5" font-weight="600" fill="#111827">Searchable in minutes</text>
  <text x="771" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">freshness is the product</text>
