  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">Listing created</text>
  <text x="167.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">a seller posts a photo</text>
  <g filter="url(#m8l4b-soft)">
    <rect x="311" y="64" width="286" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="311" y="64" width="6" height="90" fill="#4F46E5" clip-path="url(#m8l4b-k2)"/>
