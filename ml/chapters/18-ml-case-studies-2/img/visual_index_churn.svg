  <rect x="0" y="0" width="1240" height="630" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M285,109 L311,109" marker-end="url(#m8l4b-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M597,109 L623,109" marker-end="url(#m8l4b-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M919,109 L945,109" marker-end="url(#m8l4b-mslate)"/></g>
