  <g transform="translate(972.56,98.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="1009" y="116" font-size="18.5" font-weight="600" fill="#111827">Sold: tombstoned</text>
  <text x="1067.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">propagate promptly; check live status</text>
  <rect x="40" y="236" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="270" font-size="16" fill="#475569">100 million listings that churn daily. The index path is the hardest part of this case study.</text>
  <rect x="64" y="296" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="318" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Why minutes matter</text>
  <text x="288" y="318" font-size="15.5" fill="#475569">a listing nobody can find for a day may already be sold by the time it can be</text>
  <rect x="64" y="340" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="362" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The signature failure</text>
  <text x="288" y="362" font-size="15.5" fill="#475569">a results grid full of things nobody can actually buy</text>
  <rect x="64" y="384" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="406" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Filters run during search</text>
  <text x="288" y="406" font-size="15.5" fill="#475569">benchmark supported strategies for selective filters</text>
  <rect x="40" y="482" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="527" text-anchor="middle" font-size="16" fill="#475569">Selective filters need enough candidates and measured retrieval recall.</text>
</svg>