<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="610" viewBox="0 0 1240 610" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Batch and online: the same machinery in two serving modes">
  <defs>

    <filter id="m8l2a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m8l2a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m8l2a-k1"><rect x="50" y="70" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="m8l2a-k2"><rect x="650" y="70" width="540" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="610" fill="#FFFFFF"/>


  <g filter="url(#m8l2a-soft)">
    <rect x="50" y="70" width="540" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="50" y="70" width="6" height="90" fill="#2563EB" clip-path="url(#m8l2a-k1)"/>
  </g>
  <circle cx="88" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,104.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="114" y="122" font-size="18.5" font-weight="600" fill="#111827">Batch</text>
  <text x="320" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">computed ahead of time, on a schedule</text>
  <text x="320" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">Discover Weekly: one playlist per user, per week</text>
  <g filter="url(#m8l2a-lift)">
    <rect x="650" y="70" width="540" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="650" y="70" width="9" height="90" fill="#059669" clip-path="url(#m8l2a-k2)"/>
  </g>
  <circle cx="688" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,104.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="714" y="122" font-size="18.5" font-weight="600" fill="#111827">Online</text>
  <text x="920" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">computed at the moment of the request</text>
  <text x="920" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">Radio: the next track, given this session</text>
  <rect x="40" y="280" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="314" font-size="16" fill="#475569">Say this out loud in minute two and the interviewer knows the next forty minutes are structured.</text>
  <rect x="64" y="340" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="362" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Batch buys</text>
  <text x="288" y="362" font-size="15.5" fill="#475569">precomputation with a batch deadline and serving cache</text>
  <rect x="64" y="384" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="406" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Online buys</text>
  <text x="288" y="406" font-size="15.5" fill="#475569">session context: a workout session and a sleep session differ completely</text>
  <rect x="64" y="428" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="450" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Shared underneath</text>
  <text x="288" y="450" font-size="15.5" fill="#475569">one retrieval and ranking funnel, one embedding index, two serving modes</text>
  <rect x="40" y="496" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="541" text-anchor="middle" font-size="16" fill="#475569">This is the recommendation funnel worn twice. Recognition, not invention.</text>
</svg>