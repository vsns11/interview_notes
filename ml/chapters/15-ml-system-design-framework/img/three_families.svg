<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three families side by side">
  <defs>

    <filter id="m1l3b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m1l3b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>


  <text x="190" y="52" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">Family</text>
  <text x="480" y="52" font-size="16" font-weight="700" text-anchor="start" fill="#475569">Main concerns</text>
  <text x="900" y="52" font-size="16" font-weight="700" text-anchor="start" fill="#475569">Where candidates fail</text>
  <rect x="50" y="76" width="280" height="66" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="190" y="115" text-anchor="middle" font-size="17" font-weight="600" fill="#1D4ED8">1. Predictive</text>
  <text x="480" y="118" font-size="15.5" font-weight="600" text-anchor="start" fill="#1D4ED8">data, features, metrics, feedback</text>
  <text x="900" y="118" font-size="15.5" text-anchor="start" fill="#94A3B8">model choice without testing</text>
  <rect x="50" y="162" width="280" height="66" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="190" y="201" text-anchor="middle" font-size="17" font-weight="600" fill="#5B21B6">2. Generative</text>
  <text x="480" y="204" font-size="15.5" font-weight="600" text-anchor="start" fill="#5B21B6">context, cost, evaluation, safety</text>
  <text x="900" y="204" font-size="15.5" text-anchor="start" fill="#94A3B8">unjustified training, ignoring cost</text>
  <rect x="50" y="248" width="280" height="66" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="190" y="287" text-anchor="middle" font-size="17" font-weight="600" fill="#B45309">3. Agentic</text>
  <text x="480" y="290" font-size="15.5" font-weight="600" text-anchor="start" fill="#B45309">permissions, limits, oversight</text>
  <text x="900" y="290" font-size="15.5" text-anchor="start" fill="#94A3B8">no limits, or unnecessary approvals</text>
  <rect x="40" y="352" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="386" font-size="16" fill="#475569">An LLM-based agent uses generation and adds decisions about tool use and actions.</text>
  <rect x="64" y="412" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="434" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Predictive focus</text>
  <text x="288" y="434" font-size="15.5" fill="#475569">explain data, prediction quality, and how outcomes guide improvements</text>
  <rect x="64" y="456" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="478" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Generative focus</text>
  <text x="288" y="478" font-size="15.5" fill="#475569">explain context and evaluation; use retrieval or routing when needed</text>
  <rect x="64" y="500" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="522" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Agentic focus</text>
  <text x="288" y="522" font-size="15.5" fill="#475569">explain tool permissions, stopping conditions, and human oversight</text>
</svg>