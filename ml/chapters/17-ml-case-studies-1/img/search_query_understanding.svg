<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three jobs of the query understanding stage">
  <defs>
    <marker id="m3l3a-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="m3l3a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m3l3a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m3l3a-k1"><rect x="50" y="64" width="307" height="90" rx="12"/></clipPath>
    <clipPath id="m3l3a-k2"><rect x="477" y="64" width="265" height="90" rx="12"/></clipPath>
    <clipPath id="m3l3a-k3"><rect x="862" y="64" width="327" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="570" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M357,109 L477,109" marker-end="url(#m3l3a-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M742,109 L862,109" marker-end="url(#m3l3a-mslate)"/></g>
  <g filter="url(#m3l3a-soft)">
    <rect x="50" y="64" width="307" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="50" y="64" width="6" height="90" fill="#64748B" clip-path="url(#m3l3a-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">1. Normalize and spell</text>
  <text x="203.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">iphon 15 cas becomes iphone 15 case</text>
  <g filter="url(#m3l3a-soft)">
    <rect x="477" y="64" width="265" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="477" y="64" width="6" height="90" fill="#4F46E5" clip-path="url(#m3l3a-k2)"/>
  </g>
  <circle cx="515" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(504.56,98.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="541" y="116" font-size="18.5" font-weight="600" fill="#111827">2. Expand synonyms</text>
  <text x="609.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">sofa also matches couch</text>
  <g filter="url(#m3l3a-soft)">
    <rect x="862" y="64" width="327" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="862" y="64" width="6" height="90" fill="#2563EB" clip-path="url(#m3l3a-k3)"/>
  </g>
  <circle cx="900" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(889.56,98.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="926" y="116" font-size="18.5" font-weight="600" fill="#111827">3. Intent and attributes</text>
  <text x="1025.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">reliable constraints become filters</text>
  <rect x="40" y="250" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="284" font-size="16" fill="#475569">Cache repeated query processing; measure the hit rate and latency.</text>
  <rect x="64" y="310" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="332" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Cache the head</text>
  <text x="288" y="332" font-size="15.5" fill="#475569">a small set of popular queries repeats endlessly</text>
  <rect x="64" y="354" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="376" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Process rare queries</text>
  <text x="288" y="376" font-size="15.5" fill="#475569">many rare queries have few cache hits</text>
</svg>