<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="631" viewBox="0 0 1240 631" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Why search clicks lie, and the three corrections">
  <defs>
    <marker id="m3l3c-mpink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <filter id="m3l3c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m3l3c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m3l3c-k1"><rect x="415" y="56" width="410" height="90" rx="12"/></clipPath>
    <clipPath id="m3l3c-k2"><rect x="360" y="196" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="m3l3c-k3"><rect x="50" y="360" width="296" height="90" rx="12"/></clipPath>
    <clipPath id="m3l3c-k4"><rect x="502" y="360" width="286" height="90" rx="12"/></clipPath>
    <clipPath id="m3l3c-k5"><rect x="944" y="360" width="245" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="631" fill="#FFFFFF"/>

  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M620,146 V196" marker-end="url(#m3l3c-mpink)"/></g>
  <g filter="url(#m3l3c-lift)">
    <rect x="415" y="56" width="410" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="415" y="56" width="9" height="90" fill="#DB2777" clip-path="url(#m3l3c-k1)"/>
  </g>
  <circle cx="453" cy="101" r="18" fill="#FFFFFF"/>
  <g transform="translate(442.56,90.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="479" y="108" font-size="18.5" font-weight="600" fill="#111827">Higher positions receive more attention</text>
  <g filter="url(#m3l3c-soft)">
    <rect x="360" y="196" width="520" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="360" y="196" width="6" height="90" fill="#DB2777" clip-path="url(#m3l3c-k2)"/>
  </g>
  <circle cx="398" cy="241" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,230.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="424" y="248" font-size="18.5" font-weight="600" fill="#111827">Raw clicks can reinforce the previous ranking</text>
  <g filter="url(#m3l3c-soft)">
    <rect x="50" y="360" width="296" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="50" y="360" width="6" height="90" fill="#059669" clip-path="url(#m3l3c-k3)"/>
  </g>
  <circle cx="88" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,394.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="114" y="412" font-size="18.5" font-weight="600" fill="#111827">Model examination bias</text>
  <text x="198" y="475" font-size="15.5" text-anchor="middle" fill="#6B7280">separate it from relevance</text>
  <g filter="url(#m3l3c-soft)">
    <rect x="502" y="360" width="286" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="502" y="360" width="6" height="90" fill="#059669" clip-path="url(#m3l3c-k4)"/>
  </g>
  <circle cx="540" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(529.56,394.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="566" y="412" font-size="18.5" font-weight="600" fill="#111827">Propensity weighting</text>
  <text x="645" y="475" font-size="15.5" text-anchor="middle" fill="#6B7280">use exposure probabilities</text>
  <g filter="url(#m3l3c-lift)">
    <rect x="944" y="360" width="245" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="944" y="360" width="9" height="90" fill="#059669" clip-path="url(#m3l3c-k5)"/>
  </g>
  <circle cx="982" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(971.56,394.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1008" y="412" font-size="18.5" font-weight="600" fill="#111827">Preference pairs</text>
  <text x="1066.5" y="475" font-size="15.5" text-anchor="middle" fill="#6B7280">skipped 1, bought 3</text>
  <rect x="40" y="515" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="560" text-anchor="middle" font-size="16" fill="#475569">Session pairs are useful evidence, but a skipped result was not necessarily seen.</text>
</svg>