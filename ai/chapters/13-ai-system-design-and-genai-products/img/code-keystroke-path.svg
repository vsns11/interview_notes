  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">Debounce</text>
  <text x="135" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">wait for a typing pause</text>
  <g filter="url(#m6l2b-soft)">
    <rect x="319" y="64" width="255" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="319" y="64" width="6" height="90" fill="#D97706" clip-path="url(#m6l2b-k2)"/>
  </g>
  <circle cx="357" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(346.56,98.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="383" y="116" font-size="18.5" font-weight="600" fill="#111827">Heuristic context</text>
  <text x="446.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">cursor, imports, cached summaries</text>
  <g filter="url(#m6l2b-soft)">
    <rect x="673" y="64" width="235" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
