  </g>
  <circle cx="711" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(700.56,98.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="737" y="116" font-size="18.5" font-weight="600" fill="#111827">Small FIM model</text>
  <text x="790.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">latency-optimized fleet</text>
  <g filter="url(#m6l2b-soft)">
    <rect x="1007" y="64" width="183" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
