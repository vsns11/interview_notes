  </g>
  <circle cx="1045" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(1034.56,98.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1071" y="116" font-size="18.5" font-weight="600" fill="#111827">Ghost text</text>
  <text x="1098.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">or nothing at all</text>
  <rect x="40" y="250" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="284" font-size="16" fill="#475569">The client is a design component: debounce, cancel, cache, and never block the editor.</text>
  <rect x="64" y="310" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="332" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Never on this path</text>
  <text x="288" y="332" font-size="15.5" fill="#475569">start with local context; measure added retrieval cost</text>
  <rect x="64" y="354" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="376" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Retrieval feeds caches</text>
  <text x="288" y="376" font-size="15.5" fill="#475569">a background job refreshes them, never the keystroke itself</text>
  <rect x="64" y="398" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="420" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">The failure you want</text>
  <text x="288" y="420" font-size="15.5" fill="#475569">showing nothing is invisible; a slow editor loses the user</text>
</svg>