  <rect x="0" y="0" width="1240" height="500" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M220,109 L319,109" marker-end="url(#m6l2b-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M574,109 L673,109" marker-end="url(#m6l2b-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M908,109 L1007,109" marker-end="url(#m6l2b-mslate)"/></g>
  <g filter="url(#m6l2b-soft)">
