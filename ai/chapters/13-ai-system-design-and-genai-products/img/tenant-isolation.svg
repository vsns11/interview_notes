  </defs>
  <rect x="0" y="0" width="1240" height="486" fill="#FFFFFF"/>


  <g filter="url(#m6l6b-soft)">
    <rect x="50" y="64" width="245" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="50" y="64" width="6" height="90" fill="#059669" clip-path="url(#m6l6b-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">Context assembly</text>
  <text x="172.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">reads only the asking tenant’s data</text>
  <g filter="url(#m6l6b-soft)">
    <rect x="530" y="64" width="170" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
