  </g>
  <circle cx="973" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(962.56,98.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="999" y="116" font-size="18.5" font-weight="600" fill="#111827">Budgets and audit</text>
  <text x="1062.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">per-tenant limits and logs</text>
  <rect x="40" y="250" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="284" font-size="16" fill="#475569">One tenant must never see another tenant’s data, however a request gets routed.</text>
  <rect x="64" y="310" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="332" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Fail closed</text>
  <text x="288" y="332" font-size="15.5" fill="#475569">if a check cannot confirm a request is safe, it blocks the request</text>
  <rect x="64" y="354" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="376" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Governance tiers</text>
  <text x="288" y="376" font-size="15.5" fill="#475569">zero retention, regional inference, no training on customer data</text>
  <rect x="64" y="398" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="420" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Sold, not just built</text>
  <text x="288" y="420" font-size="15.5" fill="#475569">these are the features that close enterprise deals</text>
</svg>