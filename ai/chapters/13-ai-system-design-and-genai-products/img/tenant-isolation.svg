  </g>
  <circle cx="568" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(557.56,98.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="594" y="116" font-size="18.5" font-weight="600" fill="#111827">Caches</text>
  <text x="615" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">tenant and permission scoped</text>
  <g filter="url(#m6l6b-soft)">
    <rect x="935" y="64" width="255" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
