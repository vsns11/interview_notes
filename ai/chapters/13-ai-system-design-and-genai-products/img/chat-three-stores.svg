<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three stores, solving state at three timescales">
  <defs>

    <filter id="m6l1a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m6l1a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m6l1a-k1"><rect x="50" y="64" width="265" height="90" rx="12"/></clipPath>
    <clipPath id="m6l1a-k2"><rect x="523" y="64" width="265" height="90" rx="12"/></clipPath>
    <clipPath id="m6l1a-k3"><rect x="996" y="64" width="193" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>


  <g filter="url(#m6l1a-soft)">
    <rect x="50" y="64" width="265" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="50" y="64" width="6" height="90" fill="#2563EB" clip-path="url(#m6l1a-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">Conversation store</text>
  <text x="182.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">durable, append-only, partitioned</text>
  <text x="182.5" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">the product’s source of truth</text>
  <g filter="url(#m6l1a-soft)">
    <rect x="523" y="64" width="265" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="523" y="64" width="6" height="90" fill="#D97706" clip-path="url(#m6l1a-k2)"/>
  </g>
  <circle cx="561" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(550.56,98.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="587" y="116" font-size="18.5" font-weight="600" fill="#111827">The context window</text>
  <text x="655.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">packed fresh on every call</text>
  <text x="655.5" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">verbatim turns plus a summary</text>
  <g filter="url(#m6l1a-soft)">
    <rect x="996" y="64" width="193" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="996" y="64" width="6" height="90" fill="#7C3AED" clip-path="url(#m6l1a-k3)"/>
  </g>
  <circle cx="1034" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(1023.56,98.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="1060" y="116" font-size="18.5" font-weight="600" fill="#111827">User memory</text>
  <text x="1092.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">survives between chats</text>
  <text x="1092.5" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">a tiny RAG corpus of one person</text>
  <rect x="40" y="270" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="304" font-size="16" fill="#475569">The model forgets everything the moment a call ends. The product cannot.</text>
  <rect x="64" y="330" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="352" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Why not just dump it</text>
  <text x="288" y="352" font-size="15.5" fill="#475569">longer history increases token and memory costs</text>
  <rect x="64" y="374" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="396" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">The real trade</text>
  <text x="288" y="396" font-size="15.5" fill="#475569">summarizing loses detail, and users notice when it does</text>
  <rect x="64" y="418" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="440" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">What survives</text>
  <text x="288" y="440" font-size="15.5" fill="#475569">durable storage and recovery protect conversation state</text>
</svg>