<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One name, two products, opposite constraints">
  <defs>

    <filter id="m6l2a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m6l2a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m6l2a-k1"><rect x="50" y="64" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="m6l2a-k2"><rect x="650" y="64" width="540" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>


  <g filter="url(#m6l2a-lift)">
    <rect x="50" y="64" width="540" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="50" y="64" width="9" height="90" fill="#4F46E5" clip-path="url(#m6l2a-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">Inline completion</text>
  <text x="320" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">200 to 400 ms, on every keystroke pause</text>
  <text x="320" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">small fill-in-the-middle model, heuristic context</text>
  <g filter="url(#m6l2a-soft)">
    <rect x="650" y="64" width="540" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="650" y="64" width="6" height="90" fill="#7C3AED" clip-path="url(#m6l2a-k2)"/>
  </g>
  <circle cx="688" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,98.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="714" y="116" font-size="18.5" font-weight="600" fill="#111827">Chat and task help</text>
  <text x="920" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">conversational latency, a second or two</text>
  <text x="920" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">RAG over the repo, frontier models allowed</text>
  <rect x="40" y="270" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="304" font-size="16" fill="#475569">Both differ in kind, not just in size. Design them separately.</text>
  <rect x="64" y="330" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="352" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The hard limit</text>
  <text x="288" y="352" font-size="15.5" fill="#475569">benchmark model latency under realistic load</text>
  <rect x="64" y="374" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="396" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The lesson</text>
  <text x="288" y="396" font-size="15.5" fill="#475569">a tenfold tighter budget changes components, not parameters</text>
  <rect x="64" y="418" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="440" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Split it early</text>
  <text x="288" y="440" font-size="15.5" fill="#475569">define completion and chat requirements separately</text>
</svg>