    </filter>
    <clipPath id="m6l3b-k1"><rect x="50" y="64" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="m6l3b-k2"><rect x="650" y="64" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="m6l3b-k3"><rect x="420" y="256" width="400" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M590,109 H608 Q620,109 620,121 V246" marker-end="url(#m6l3b-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M650,109 H632 Q620,109 620,121 V246" marker-end="url(#m6l3b-mslate)"/></g>
  <g filter="url(#m6l3b-lift)">
