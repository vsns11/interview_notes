  <rect x="64" y="410" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="432" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Without them</text>
  <text x="288" y="432" font-size="15.5" fill="#475569">10K QPS at a cent an answer is $8.6M a day</text>
  <rect x="64" y="454" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="476" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">The three settings</text>
  <text x="288" y="476" font-size="15.5" fill="#475569">trigger rate, cache miss rate, cost per answer; you own all three</text>
