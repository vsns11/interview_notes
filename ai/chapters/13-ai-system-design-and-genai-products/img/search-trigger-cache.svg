  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">Trigger classifier</text>
  <text x="320" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">select useful queries within a budget</text>
  <text x="320" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">conservative on medical, financial, legal</text>
  <g filter="url(#m6l3b-lift)">
    <rect x="650" y="64" width="540" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="650" y="64" width="9" height="90" fill="#059669" clip-path="url(#m6l3b-k2)"/>
  </g>
  <circle cx="688" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,98.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="714" y="116" font-size="18.5" font-weight="600" fill="#111827">Semantic answer cache</text>
  <text x="920" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">one answer serves the popular head</text>
  <text x="920" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">invalidated when results shift meaningfully</text>
