<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="486" viewBox="0 0 1240 486" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A guardrail runs outside the model, never inside it">
  <defs>
    <marker id="m6l0c-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="m6l0c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m6l0c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m6l0c-k1"><rect x="50" y="64" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="m6l0c-k2"><rect x="450" y="64" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="m6l0c-k3"><rect x="850" y="64" width="340" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="486" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M390,109 L450,109" marker-end="url(#m6l0c-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M790,109 L850,109" marker-end="url(#m6l0c-mslate)"/></g>
  <g filter="url(#m6l0c-soft)">
    <rect x="50" y="64" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="50" y="64" width="6" height="90" fill="#059669" clip-path="url(#m6l0c-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">Check before</text>
  <text x="220" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">input classifiers, injection defense</text>
  <g filter="url(#m6l0c-soft)">
    <rect x="450" y="64" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="450" y="64" width="6" height="90" fill="#64748B" clip-path="url(#m6l0c-k2)"/>
  </g>
  <circle cx="488" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,98.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="514" y="116" font-size="18.5" font-weight="600" fill="#111827">The model</text>
  <text x="620" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">never fully trusted on its own</text>
  <g filter="url(#m6l0c-soft)">
    <rect x="850" y="64" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="850" y="64" width="6" height="90" fill="#059669" clip-path="url(#m6l0c-k3)"/>
  </g>
  <circle cx="888" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(877.56,98.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="914" y="116" font-size="18.5" font-weight="600" fill="#111827">Check after</text>
  <text x="1020" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">output filters, action gates</text>
  <rect x="40" y="250" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="284" font-size="16" fill="#475569">Use checks before and after generation, with clear failure policies.</text>
  <rect x="64" y="310" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="332" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The whole point</text>
  <text x="288" y="332" font-size="15.5" fill="#475569">a guardrail does not sit inside the model it is guarding</text>
  <rect x="64" y="354" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="376" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The assumption</text>
  <text x="288" y="376" font-size="15.5" fill="#475569">external checks reduce risk but can also fail</text>
  <rect x="64" y="398" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="420" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">What they enforce</text>
  <text x="288" y="420" font-size="15.5" fill="#475569">rules the model cannot be trusted to enforce alone</text>
</svg>