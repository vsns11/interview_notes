<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Enforce permissions inside the retrieval query, never after">
  <defs>

    <filter id="m5l6b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m5l6b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m5l6b-k1"><rect x="360" y="50" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="m5l6b-k2"><rect x="50" y="250" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="m5l6b-k3"><rect x="650" y="250" width="540" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>


  <g filter="url(#m5l6b-lift)">
    <rect x="360" y="50" width="520" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="360" y="50" width="9" height="90" fill="#059669" clip-path="url(#m5l6b-k1)"/>
  </g>
  <circle cx="398" cy="95" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,84.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="424" y="102" font-size="18.5" font-weight="600" fill="#111827">Retrieval constraints</text>
  <text x="620" y="165" font-size="15.5" text-anchor="middle" fill="#6B7280">authorization on lexical and ANN paths</text>
  <text x="620" y="206" font-size="15.5" font-weight="600" text-anchor="middle" fill="#047857">filter early; verify current access</text>
  <g filter="url(#m5l6b-soft)">
    <rect x="50" y="250" width="540" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="50" y="250" width="6" height="90" fill="#DB2777" clip-path="url(#m5l6b-k2)"/>
  </g>
  <circle cx="88" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,284.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="114" y="302" font-size="18.5" font-weight="600" fill="#111827">Before generation</text>
  <text x="320" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">only authorized evidence enters model context</text>
  <g filter="url(#m5l6b-soft)">
    <rect x="650" y="250" width="540" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="650" y="250" width="6" height="90" fill="#DB2777" clip-path="url(#m5l6b-k3)"/>
  </g>
  <circle cx="688" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,284.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="714" y="302" font-size="18.5" font-weight="600" fill="#111827">At display time</text>
  <text x="920" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">the content already leaked into the answer</text>
  <rect x="40" y="400" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="430" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="452" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Fail closed</text>
  <text x="288" y="452" font-size="15.5" fill="#475569">if group resolution is down, do not answer from restricted spaces</text>
  <rect x="64" y="474" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="496" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">The invariant</text>
  <text x="288" y="496" font-size="15.5" fill="#475569">zero permission leaks, never a metric you optimize toward</text>
</svg>