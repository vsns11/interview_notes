<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="496" viewBox="0 0 1240 496" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="RAG is two systems, and the search engine decides quality">
  <defs>
    <marker id="m5l0b-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="m5l0b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m5l0b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m5l0b-k1"><rect x="50" y="64" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="m5l0b-k2"><rect x="650" y="64" width="540" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="496" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M590,109 L650,109" marker-end="url(#m5l0b-mslate)"/></g>
  <g filter="url(#m5l0b-lift)">
    <rect x="50" y="64" width="540" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="50" y="64" width="9" height="90" fill="#4F46E5" clip-path="url(#m5l0b-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">The search engine</text>
  <text x="320" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">chooses which passages the model ever sees</text>
  <g filter="url(#m5l0b-soft)">
    <rect x="650" y="64" width="540" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="650" y="64" width="6" height="90" fill="#7C3AED" clip-path="url(#m5l0b-k2)"/>
  </g>
  <circle cx="688" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,98.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.9L18.8 9.8l-4.9 1.9L12 16.6l-1.9-4.9L5.2 9.8l4.9-1.9z"/><path d="M18.5 15.5l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z"/></g>
  <text x="714" y="116" font-size="18.5" font-weight="600" fill="#111827">The language model</text>
  <text x="920" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">writes an answer from what it was handed</text>
  <rect x="40" y="250" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="284" font-size="16" fill="#475569">Evaluate retrieval and generation separately; either stage can cause an incorrect answer.</text>
  <rect x="64" y="310" width="200" height="32" rx="9" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="164" y="332" text-anchor="middle" font-size="15.5" font-weight="600" fill="#4338CA">Evidence quality</text>
  <text x="288" y="332" font-size="15.5" fill="#475569">a model cannot be faithful to context it never received</text>
  <rect x="64" y="354" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="376" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Missing evidence</text>
  <text x="288" y="376" font-size="15.5" fill="#475569">search again, ask for clarification, or decline to answer</text>
  <rect x="64" y="398" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="420" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Where time goes</text>
  <text x="288" y="420" font-size="15.5" fill="#475569">explain both retrieval and generation decisions</text>
</svg>