<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Bi-encoder scores separately; cross-encoder reads them together">
  <defs>

    <filter id="m5l4b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m5l4b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m5l4b-k1"><rect x="70" y="106" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="m5l4b-k2"><rect x="350" y="106" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="m5l4b-k3"><rect x="700" y="106" width="440" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>
  <rect x="40" y="50" width="560" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="80" font-size="16.5" font-weight="600" fill="#1D4ED8">Bi-encoder: fast, precomputable</text>
  <rect x="640" y="50" width="560" height="230" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="664" y="80" font-size="16.5" font-weight="600" fill="#5B21B6">Cross-encoder: joint scoring</text>

  <g filter="url(#m5l4b-soft)">
    <rect x="70" y="106" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="70" y="106" width="6" height="90" fill="#2563EB" clip-path="url(#m5l4b-k1)"/>
  </g>
  <circle cx="108" cy="151" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,140.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="134" y="158" font-size="18.5" font-weight="600" fill="#111827">Query</text>
  <g filter="url(#m5l4b-soft)">
    <rect x="350" y="106" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="350" y="106" width="6" height="90" fill="#2563EB" clip-path="url(#m5l4b-k2)"/>
  </g>
  <circle cx="388" cy="151" r="18" fill="#FFFFFF"/>
  <g transform="translate(377.56,140.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="414" y="158" font-size="18.5" font-weight="600" fill="#111827">Chunk</text>
  <text x="320" y="252" font-size="15.5" font-weight="600" text-anchor="middle" fill="#1D4ED8">encoded apart, compared later</text>
  <g filter="url(#m5l4b-lift)">
    <rect x="700" y="106" width="440" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="700" y="106" width="9" height="90" fill="#7C3AED" clip-path="url(#m5l4b-k3)"/>
  </g>
  <circle cx="738" cy="151" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,140.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="764" y="158" font-size="18.5" font-weight="600" fill="#111827">Query and chunk, read together</text>
  <text x="920" y="252" font-size="15.5" font-weight="600" text-anchor="middle" fill="#5B21B6">joint input, one relevance score</text>
  <rect x="40" y="310" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="344" font-size="16" fill="#475569">The bi-encoder is what makes ANN search possible. That independence is also its limit.</text>
  <rect x="64" y="370" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="392" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Why it scales</text>
  <text x="288" y="392" font-size="15.5" fill="#475569">the document side never waits for the query to show up</text>
  <rect x="64" y="414" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="436" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Why it cannot</text>
  <text x="288" y="436" font-size="15.5" fill="#475569">candidate count depends on the serving budget</text>
</svg>