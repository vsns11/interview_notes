<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="612" viewBox="0 0 1240 612" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two searches in parallel, merged by rank">
  <defs>
    <marker id="m5l4a-mamber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m5l4a-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="m5l4a-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m5l4a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m5l4a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m5l4a-k1"><rect x="50" y="64" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="m5l4a-k2"><rect x="670" y="64" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="m5l4a-k3"><rect x="460" y="218" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="m5l4a-k4"><rect x="450" y="344" width="340" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="612" fill="#FFFFFF"/>

  <g fill="none" stroke="#D97706" stroke-width="2"><path d="M570,109 H598 Q610,109 610,121 V206" marker-end="url(#m5l4a-mamber)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M670,109 H642 Q630,109 630,121 V206" marker-end="url(#m5l4a-mviolet)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M620,308 V344" marker-end="url(#m5l4a-memerald)"/></g>
  <g filter="url(#m5l4a-soft)">
    <rect x="50" y="64" width="520" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="50" y="64" width="6" height="90" fill="#D97706" clip-path="url(#m5l4a-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">BM25 lexical search</text>
  <text x="310" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">exact words over an inverted index</text>
  <g filter="url(#m5l4a-soft)">
    <rect x="670" y="64" width="520" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="670" y="64" width="6" height="90" fill="#7C3AED" clip-path="url(#m5l4a-k2)"/>
  </g>
  <circle cx="708" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(697.56,98.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="734" y="116" font-size="18.5" font-weight="600" fill="#111827">Vector ANN search</text>
  <text x="930" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">meaning over embeddings</text>
  <g filter="url(#m5l4a-lift)">
    <rect x="460" y="218" width="320" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="460" y="218" width="9" height="90" fill="#059669" clip-path="url(#m5l4a-k3)"/>
  </g>
  <circle cx="498" cy="263" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,252.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="524" y="270" font-size="18.5" font-weight="600" fill="#111827">Reciprocal rank fusion</text>
  <g filter="url(#m5l4a-soft)">
    <rect x="450" y="344" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="450" y="344" width="6" height="90" fill="#64748B" clip-path="url(#m5l4a-k4)"/>
  </g>
  <circle cx="488" cy="389" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,378.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="514" y="396" font-size="18.5" font-weight="600" fill="#111827">One merged, filtered list</text>
  <rect x="40" y="464" width="1160" height="108" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="498" font-size="16" fill="#475569">Embeddings miss exact identifiers. Keywords miss paraphrase. Each covers the other.</text>
  <rect x="64" y="524" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="546" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Why rank, not score</text>
  <text x="288" y="546" font-size="15.5" fill="#475569">BM25 and cosine sit on completely incomparable scales</text>
</svg>