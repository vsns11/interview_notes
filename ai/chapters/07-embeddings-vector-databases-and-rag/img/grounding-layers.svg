<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="748" viewBox="0 0 1240 748" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four layers, because none of them is sufficient alone">
  <defs>

    <filter id="m5l5a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m5l5a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m5l5a-k1"><rect x="220" y="56" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="m5l5a-k2"><rect x="220" y="192" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="m5l5a-k3"><rect x="220" y="328" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="m5l5a-k4"><rect x="220" y="464" width="560" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="748" fill="#FFFFFF"/>


  <g filter="url(#m5l5a-lift)">
    <rect x="220" y="56" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="220" y="56" width="9" height="90" fill="#2563EB" clip-path="url(#m5l5a-k1)"/>
  </g>
  <circle cx="258" cy="101" r="18" fill="#FFFFFF"/>
  <g transform="translate(247.56,90.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="284" y="108" font-size="18.5" font-weight="600" fill="#111827">Layer 1: instructions</text>
  <text x="500" y="171" font-size="15.5" text-anchor="middle" fill="#6B7280">answer only from context; say so when it is missing</text>
  <g filter="url(#m5l5a-lift)">
    <rect x="220" y="192" width="560" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="220" y="192" width="9" height="90" fill="#4F46E5" clip-path="url(#m5l5a-k2)"/>
  </g>
  <circle cx="258" cy="237" r="18" fill="#FFFFFF"/>
  <g transform="translate(247.56,226.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="284" y="244" font-size="18.5" font-weight="600" fill="#111827">Layer 2: citations</text>
  <text x="500" y="307" font-size="15.5" text-anchor="middle" fill="#6B7280">claim-source pairs, machine-verified to resolve</text>
  <g filter="url(#m5l5a-lift)">
    <rect x="220" y="328" width="560" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="220" y="328" width="9" height="90" fill="#7C3AED" clip-path="url(#m5l5a-k3)"/>
  </g>
  <circle cx="258" cy="373" r="18" fill="#FFFFFF"/>
  <g transform="translate(247.56,362.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="284" y="380" font-size="18.5" font-weight="600" fill="#111827">Layer 3: entailment checks</text>
  <text x="500" y="443" font-size="15.5" text-anchor="middle" fill="#6B7280">per claim, against the cited passage</text>
  <g filter="url(#m5l5a-lift)">
    <rect x="220" y="464" width="560" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="220" y="464" width="9" height="90" fill="#059669" clip-path="url(#m5l5a-k4)"/>
  </g>
  <circle cx="258" cy="509" r="18" fill="#FFFFFF"/>
  <g transform="translate(247.56,498.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="284" y="516" font-size="18.5" font-weight="600" fill="#111827">Layer 4: designed refusal</text>
  <text x="500" y="579" font-size="15.5" text-anchor="middle" fill="#6B7280">a first-class outcome, measured both ways</text>
  <rect x="40" y="600" width="1160" height="108" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="634" font-size="16" fill="#475569">Even a model holding the right document can contradict it, or add details not in it.</text>
  <rect x="64" y="660" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="682" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The limit</text>
  <text x="288" y="682" font-size="15.5" fill="#475569">check source quality too; verifiers can also make mistakes</text>
</svg>