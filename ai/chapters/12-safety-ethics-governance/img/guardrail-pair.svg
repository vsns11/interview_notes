  <g transform="translate(457.56,98.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="494" y="116" font-size="18.5" font-weight="600" fill="#111827">Hardened assembly</text>
  <text x="557.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">content tagged as data, least privilege</text>
