  <circle cx="908" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(897.56,98.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="934" y="116" font-size="18.5" font-weight="600" fill="#111827">Observe</text>
  <text x="1030" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">read the result</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="620" y="20" fill="#475569">repeat until done, or a bound stops it</text></g>
  <rect x="40" y="250" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="284" font-size="16" fill="#475569">Every design question in this module is really a question about the loop.</text>
  <rect x="64" y="310" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="332" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">What enters it</text>
  <text x="288" y="332" font-size="15.5" fill="#475569">context: what the model gets to see at this step</text>
  <rect x="64" y="354" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="376" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">What it may touch</text>
  <text x="288" y="376" font-size="15.5" fill="#475569">tools: the full set of actions it is allowed to propose</text>
  <rect x="64" y="398" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="420" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">How it ends</text>
  <text x="288" y="420" font-size="15.5" fill="#475569">bounds: steps, tokens, time, spend; then stop and escalate</text>
</svg>