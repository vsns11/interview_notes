      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m7l0c-k1"><rect x="50" y="64" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="m7l0c-k2"><rect x="460" y="64" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="m7l0c-k3"><rect x="870" y="64" width="320" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="486" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M370,109 L460,109" marker-end="url(#m7l0c-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M780,109 L870,109" marker-end="url(#m7l0c-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M1030,64 V40 Q1030,28 1018,28 H222 Q210,28 210,40 V52" marker-end="url(#m7l0c-mslate)"/></g>
  <g filter="url(#m7l0c-soft)">
    <rect x="50" y="64" width="320" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="50" y="64" width="6" height="90" fill="#7C3AED" clip-path="url(#m7l0c-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.9L18.8 9.8l-4.9 1.9L12 16.6l-1.9-4.9L5.2 9.8l4.9-1.9z"/><path d="M18.5 15.5l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">Reason</text>
  <text x="210" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">what should happen next?</text>
  <g filter="url(#m7l0c-soft)">
    <rect x="460" y="64" width="320" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="460" y="64" width="6" height="90" fill="#4F46E5" clip-path="url(#m7l0c-k2)"/>
  </g>
  <circle cx="498" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,98.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="524" y="116" font-size="18.5" font-weight="600" fill="#111827">Act</text>
  <text x="620" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">call a tool</text>
  <g filter="url(#m7l0c-soft)">
    <rect x="870" y="64" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="870" y="64" width="6" height="90" fill="#2563EB" clip-path="url(#m7l0c-k3)"/>
