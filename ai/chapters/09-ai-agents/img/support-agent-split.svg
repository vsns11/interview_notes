  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">Intake</text>
  <text x="220" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">identify and classify</text>
  <text x="220" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">a workflow</text>
