  <text x="514" y="116" font-size="18.5" font-weight="600" fill="#111827">FAQ answers</text>
  <text x="620" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">RAG over policy docs</text>
  <text x="620" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">no agent needed</text>
