  <text x="164" y="322" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Say it early</text>
  <text x="288" y="322" font-size="15.5" fill="#475569">example: 60 percent use workflows or RAG</text>
  <rect x="64" y="344" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="366" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Why it matters</text>
  <text x="288" y="366" font-size="15.5" fill="#475569">the split governs both cost and risk; it is part of the design</text>
