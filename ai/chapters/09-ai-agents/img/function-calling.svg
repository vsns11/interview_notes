  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">Menu in context</text>
  <text x="167.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">name, description, schema</text>
  <g filter="url(#m7l2a-soft)">
