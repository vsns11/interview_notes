  <g transform="translate(345.56,98.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="382" y="116" font-size="18.5" font-weight="600" fill="#111827">Structured request</text>
  <text x="450.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">generation pauses here</text>
