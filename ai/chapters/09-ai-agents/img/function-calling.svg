  <text x="999" y="116" font-size="18.5" font-weight="600" fill="#111827">Result as context</text>
  <text x="1062.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">ready for the next step</text>
  <rect x="40" y="250" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="284" font-size="16" fill="#475569">The model emits a request like {"tool": "lookup_order", "args": {"order_id": "4711"}}.</text>
  <rect x="64" y="310" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="332" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The separation</text>
  <text x="288" y="332" font-size="15.5" fill="#475569">the model proposes; the runtime decides. That is the architecture.</text>
  <rect x="64" y="354" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="376" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Portability</text>
  <text x="288" y="376" font-size="15.5" fill="#475569">protocols like MCP make tool menus portable across models</text>
