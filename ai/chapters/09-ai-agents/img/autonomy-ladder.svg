  <text x="164" y="346" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Tiers climb apart</text>
  <text x="288" y="346" font-size="15.5" fill="#475569">ticket notes reach stage 4 in weeks; refunds may sit at 3 forever</text>
  <rect x="64" y="368" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
