  <text x="976" y="116" font-size="18.5" font-weight="600" fill="#111827">4. Audited autonomy</text>
  <text x="1050" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">reviewed after the fact</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="620" y="18" fill="#BE185D">a regression or incident demotes the tier automatically</text></g>
