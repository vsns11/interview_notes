<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Tools tiered by consequence, each tier with its control">
  <defs>

    <filter id="m7l2c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m7l2c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>


  <rect x="50" y="60" width="300" height="56" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="94" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Read</text>
  <text x="360" y="84" font-size="15.5" text-anchor="start" fill="#6B7280">look up order, search the knowledge base</text>
  <text x="360" y="106" font-size="15.5" font-weight="600" text-anchor="start" fill="#047857">authorized, rate-limited, logged</text>
  <rect x="50" y="136" width="300" height="56" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="200" y="170" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Reversible write</text>
  <text x="360" y="160" font-size="15.5" text-anchor="start" fill="#6B7280">draft email, add note, update ticket</text>
  <text x="360" y="182" font-size="15.5" font-weight="600" text-anchor="start" fill="#1D4ED8">policy-limited, with an undo path</text>
  <rect x="50" y="212" width="300" height="56" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="200" y="246" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Consequential write</text>
  <text x="360" y="236" font-size="15.5" text-anchor="start" fill="#6B7280">refund within cap, reschedule delivery</text>
  <text x="360" y="258" font-size="15.5" font-weight="600" text-anchor="start" fill="#B45309">policy checked in-tool, sampled review</text>
  <rect x="50" y="288" width="300" height="56" rx="8" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="200" y="322" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Irreversible</text>
  <text x="360" y="312" font-size="15.5" text-anchor="start" fill="#6B7280">refund above cap, delete data, send out</text>
  <text x="360" y="334" font-size="15.5" font-weight="600" text-anchor="start" fill="#BE185D">human approval gate, always</text>
  <rect x="40" y="378" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="412" font-size="16" fill="#475569">Read each row as "how much damage can this do, and what watches it".</text>
  <rect x="64" y="438" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="460" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The action gate</text>
  <text x="288" y="460" font-size="15.5" fill="#475569">validates arguments, checks the tier, holds for approval, logs it all</text>
  <rect x="64" y="482" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="504" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Last line on injection</text>
  <text x="288" y="504" font-size="15.5" fill="#475569">the model got fooled into proposing; the gate still refused</text>
</svg>