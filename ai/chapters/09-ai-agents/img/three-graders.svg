  <text x="64" y="284" font-size="16" fill="#475569">World-state assertions first: the refund exists, the ticket closed, the tests pass.</text>
  <rect x="64" y="310" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="332" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Validate the judge</text>
  <text x="288" y="332" font-size="15.5" fill="#475569">know its agreement rate with humans before trusting any score</text>
