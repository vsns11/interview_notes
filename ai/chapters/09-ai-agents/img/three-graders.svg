  <text x="164" y="420" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Pair with cost</text>
  <text x="288" y="420" font-size="15.5" fill="#475569">agents fail two ways: giving up cheaply, and succeeding expensively</text>
