  <text x="164" y="376" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Route metrics</text>
  <text x="288" y="376" font-size="15.5" fill="#475569">steps against expert, wrong-tool rate, and recovery rate after errors</text>
