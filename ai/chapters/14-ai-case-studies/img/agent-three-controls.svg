<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three advantages the coding domain hands you for free">
  <defs>

    <filter id="m8l8a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m8l8a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m8l8a-k1"><rect x="50" y="70" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="m8l8a-k2"><rect x="440" y="70" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="m8l8a-k3"><rect x="830" y="70" width="360" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>


  <g filter="url(#m8l8a-lift)">
    <rect x="50" y="70" width="360" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="50" y="70" width="9" height="90" fill="#059669" clip-path="url(#m8l8a-k1)"/>
  </g>
  <circle cx="88" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,104.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="122" font-size="18.5" font-weight="600" fill="#111827">Automated checks</text>
  <text x="230" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">tests, compilers, linters</text>
  <text x="230" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">useful evidence, not proof of correctness</text>
  <g filter="url(#m8l8a-lift)">
    <rect x="440" y="70" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="440" y="70" width="9" height="90" fill="#2563EB" clip-path="url(#m8l8a-k2)"/>
  </g>
  <circle cx="478" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,104.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="504" y="122" font-size="18.5" font-weight="600" fill="#111827">Execution isolation</text>
  <text x="620" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">ephemeral containers</text>
  <text x="620" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">harden and test the isolation boundary</text>
  <g filter="url(#m8l8a-lift)">
    <rect x="830" y="70" width="360" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="830" y="70" width="9" height="90" fill="#7C3AED" clip-path="url(#m8l8a-k3)"/>
  </g>
  <circle cx="868" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(857.56,104.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="894" y="122" font-size="18.5" font-weight="600" fill="#111827">A gate that exists</text>
  <text x="1010" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">the pull request</text>
  <text x="1010" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">every team already reviews them</text>
  <rect x="40" y="268" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="302" font-size="16" fill="#475569">The design job is to use all three systematically, rather than to invent new controls.</text>
  <rect x="64" y="328" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="350" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Why coding first</text>
  <text x="288" y="350" font-size="15.5" fill="#475569">code provides useful automated checks and review workflows</text>
  <rect x="64" y="372" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="394" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The thesis sentence</text>
  <text x="288" y="394" font-size="15.5" fill="#475569">sandboxing and code review address different risks</text>
  <rect x="64" y="416" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="438" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">The honest ceiling</text>
  <text x="288" y="438" font-size="15.5" fill="#475569">the agent proposes and humans merge; auto-merge stays a distant, evidence-gated step</text>
  <rect x="40" y="528" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="573" text-anchor="middle" font-size="16" fill="#475569">Junior engineers get code review, scoped access, and revoked credentials. The metaphor is the control design.</text>
</svg>