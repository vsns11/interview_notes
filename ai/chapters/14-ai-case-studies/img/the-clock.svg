<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The forty-five minute clock, phase by phase">
  <defs>

    <filter id="m8l1a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m8l1a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="650" fill="#FFFFFF"/>


  <text x="50" y="92" font-size="16.5" font-weight="600" text-anchor="start" fill="#111827">Frame and success</text>
  <text x="50" y="114" font-size="14.5" text-anchor="start" fill="#94A3B8">Steps 1-2</text>
  <rect x="340" y="66" width="432" height="42" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="556" y="93" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">8 min</text>
  <text x="786" y="93" font-size="15.5" text-anchor="start" fill="#6B7280">minutes 0 to 8</text>
  <text x="50" y="154" font-size="16.5" font-weight="600" text-anchor="start" fill="#111827">Data and labels</text>
  <text x="50" y="176" font-size="14.5" text-anchor="start" fill="#94A3B8">Step 3</text>
  <rect x="340" y="128" width="270" height="42" rx="8" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="475" y="155" text-anchor="middle" font-size="15.5" font-weight="600" fill="#4338CA">5 min</text>
  <text x="624" y="155" font-size="15.5" text-anchor="start" fill="#6B7280">minutes 8 to 13</text>
  <text x="50" y="216" font-size="16.5" font-weight="600" text-anchor="start" fill="#111827">Model choice</text>
  <text x="50" y="238" font-size="14.5" text-anchor="start" fill="#94A3B8">Step 4</text>
  <rect x="340" y="190" width="270" height="42" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="475" y="217" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">5 min</text>
  <text x="624" y="217" font-size="15.5" text-anchor="start" fill="#6B7280">minutes 13 to 18</text>
  <text x="50" y="278" font-size="16.5" font-weight="600" text-anchor="start" fill="#111827">Architecture</text>
  <text x="50" y="300" font-size="14.5" text-anchor="start" fill="#94A3B8">Step 5</text>
  <rect x="340" y="252" width="648" height="42" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="664" y="279" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">12 min</text>
  <text x="1002" y="279" font-size="15.5" text-anchor="start" fill="#6B7280">minutes 18 to 30</text>
  <text x="50" y="340" font-size="16.5" font-weight="600" text-anchor="start" fill="#111827">Loop and evaluation</text>
  <text x="50" y="362" font-size="14.5" text-anchor="start" fill="#94A3B8">Step 6</text>
  <rect x="340" y="314" width="432" height="42" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="556" y="341" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">8 min</text>
  <text x="786" y="341" font-size="15.5" text-anchor="start" fill="#6B7280">minutes 30 to 38</text>
  <text x="50" y="402" font-size="16.5" font-weight="600" text-anchor="start" fill="#111827">Failures and cost</text>
  <text x="50" y="424" font-size="14.5" text-anchor="start" fill="#94A3B8">Step 7</text>
  <rect x="340" y="376" width="270" height="42" rx="8" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="475" y="403" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">5 min</text>
  <text x="624" y="403" font-size="15.5" text-anchor="start" fill="#6B7280">minutes 38 to 43</text>
  <text x="50" y="464" font-size="16.5" font-weight="600" text-anchor="start" fill="#111827">Slack, held</text>
  <text x="50" y="486" font-size="14.5" text-anchor="start" fill="#94A3B8">Follow-ups</text>
  <rect x="340" y="438" width="108" height="42" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="394" y="465" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">2 min</text>
  <text x="462" y="465" font-size="15.5" text-anchor="start" fill="#6B7280">minutes 43 to 45</text>
  <rect x="40" y="508" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="553" text-anchor="middle" font-size="16" fill="#475569">Each phase ends with its exit criterion said aloud, then movement, even if more could be said.</text>
</svg>