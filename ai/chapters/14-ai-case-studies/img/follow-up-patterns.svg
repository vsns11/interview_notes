<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="610" viewBox="0 0 1240 610" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five follow-up patterns and the stance for each">
  <defs>

    <filter id="m8l1b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m8l1b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="610" fill="#FFFFFF"/>


  <rect x="50" y="60" width="260" height="58" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="180" y="95" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">The redirect</text>
  <text x="324" y="84" font-size="15.5" text-anchor="start" fill="#6B7280">"skip ahead to the architecture"</text>
  <text x="324" y="106" font-size="15.5" font-weight="600" text-anchor="start" fill="#1D4ED8">comply instantly, but carry your targets and budgets with you</text>
  <rect x="50" y="138" width="260" height="58" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="180" y="173" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">The stress test</text>
  <text x="324" y="162" font-size="15.5" text-anchor="start" fill="#6B7280">"10x the traffic", "the provider is down"</text>
  <text x="324" y="184" font-size="15.5" font-weight="600" text-anchor="start" fill="#B45309">answer from the fallback sequence, then name the alarm that catches it</text>
  <rect x="50" y="216" width="260" height="58" rx="8" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="180" y="251" text-anchor="middle" font-size="15.5" font-weight="600" fill="#4338CA">The depth probe</text>
  <text x="324" y="240" font-size="15.5" text-anchor="start" fill="#6B7280">"how exactly does the reranker work?"</text>
  <text x="324" y="262" font-size="15.5" font-weight="600" text-anchor="start" fill="#4338CA">two levels down: name the mechanism, then its trade-off, then offer a third</text>
  <rect x="50" y="294" width="260" height="58" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="180" y="329" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">The disagreement</text>
  <text x="324" y="318" font-size="15.5" text-anchor="start" fill="#6B7280">"I would have used fine-tuning there"</text>
  <text x="324" y="340" font-size="15.5" font-weight="600" text-anchor="start" fill="#5B21B6">neither give in nor refuse: name the variable that decides it, and let it decide</text>
  <rect x="50" y="372" width="260" height="58" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="180" y="407" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">The silence</text>
  <text x="324" y="396" font-size="15.5" text-anchor="start" fill="#6B7280">the interviewer stops talking</text>
  <text x="324" y="418" font-size="15.5" font-weight="600" text-anchor="start" fill="#475569">continue with the plan, or ask whether more detail would help</text>
  <rect x="40" y="456" width="1160" height="108" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="490" font-size="16" fill="#475569">Note secondary topics while preserving time for the main requirements.</text>
  <rect x="64" y="516" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="538" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The habit underneath</text>
  <text x="288" y="538" font-size="15.5" fill="#475569">announce the plan in minute one, timebox aloud, note side topics and move on</text>
</svg>