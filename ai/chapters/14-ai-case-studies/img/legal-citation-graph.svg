<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A citation graph carries the validity of every case it links">
  <defs>
    <marker id="m8l5b-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="m8l5b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m8l5b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M456,122 L206,195" marker-end="url(#m8l5b-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M736,196 L486,123" marker-end="url(#m8l5b-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M1016,122 L766,195" marker-end="url(#m8l5b-mslate)"/></g>
  <circle cx="190" cy="200" r="15" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="190" y="172" font-size="16.5" font-weight="700" text-anchor="middle" fill="#111827">1998 ruling</text>
  <text x="190" y="240" font-size="15.5" font-weight="600" text-anchor="middle" fill="#1D4ED8">the original authority</text>
  <circle cx="470" cy="118" r="15" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2.5"/>
  <text x="470" y="90" font-size="16.5" font-weight="700" text-anchor="middle" fill="#111827">2006 case</text>
  <text x="470" y="158" font-size="15.5" font-weight="600" text-anchor="middle" fill="#4338CA">affirmed it</text>
  <circle cx="750" cy="200" r="15" fill="#FCE7F3" stroke="#DB2777" stroke-width="2.5"/>
  <text x="750" y="172" font-size="16.5" font-weight="700" text-anchor="middle" fill="#111827">2014 case</text>
  <text x="750" y="240" font-size="15.5" font-weight="600" text-anchor="middle" fill="#BE185D">overruled it</text>
  <circle cx="1030" cy="118" r="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="1030" y="90" font-size="16.5" font-weight="700" text-anchor="middle" fill="#111827">2021 case</text>
  <text x="1030" y="158" font-size="15.5" font-weight="600" text-anchor="middle" fill="#5B21B6">follows the 2014 line</text>
  <text x="620" y="292" font-size="16.5" font-weight="600" text-anchor="middle" fill="#475569">Every case is a dot. Every citation is an arrow to the case it leans on.</text>
  <rect x="40" y="322" width="1160" height="240" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="356" font-size="16" fill="#475569">A ruling can be valid, amended, superseded, or overruled, and the answer must know which.</text>
  <rect x="64" y="382" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="404" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Stored per chunk</text>
  <text x="288" y="404" font-size="15.5" fill="#475569">jurisdiction, court level, date, and treatment status</text>
  <rect x="64" y="426" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="448" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Treatment status</text>
  <text x="288" y="448" font-size="15.5" fill="#475569">whether later cases affirmed, distinguished, or overturned this one</text>
  <rect x="64" y="470" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="492" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Catastrophe one</text>
  <text x="288" y="492" font-size="15.5" fill="#475569">check treatment by issue; metadata alone is insufficient</text>
  <rect x="64" y="514" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="536" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Catastrophe two</text>
  <text x="288" y="536" font-size="15.5" fill="#475569">clarify jurisdiction and the role of each authority</text>
  <rect x="40" y="584" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="629" text-anchor="middle" font-size="16" fill="#475569">Chunking follows legal structure too: opinions by section, statutes by clause.</text>
</svg>