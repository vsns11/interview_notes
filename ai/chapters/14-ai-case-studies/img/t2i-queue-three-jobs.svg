<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One queue doing three jobs at once">
  <defs>
    <marker id="m8l7b-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="m8l7b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m8l7b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m8l7b-k1"><rect x="50" y="70" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="m8l7b-k2"><rect x="440" y="70" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="m8l7b-k3"><rect x="830" y="70" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="m8l7b-k4"><rect x="320" y="272" width="600" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>

  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M230,236 L1010,236"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M230,224 L230,236"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M620,224 L620,236"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M1010,224 L1010,236"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M620,236 L620,272" marker-end="url(#m8l7b-mviolet)"/></g>
  <g filter="url(#m8l7b-lift)">
    <rect x="50" y="70" width="360" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="50" y="70" width="9" height="90" fill="#059669" clip-path="url(#m8l7b-k1)"/>
  </g>
  <circle cx="88" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,104.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="114" y="122" font-size="18.5" font-weight="600" fill="#111827">Paid</text>
  <text x="230" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">priority and reserved capacity</text>
  <text x="230" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">the wait is the promise</text>
  <g filter="url(#m8l7b-soft)">
    <rect x="440" y="70" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="440" y="70" width="6" height="90" fill="#2563EB" clip-path="url(#m8l7b-k2)"/>
  </g>
  <circle cx="478" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,104.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="504" y="122" font-size="18.5" font-weight="600" fill="#111827">Free</text>
  <text x="620" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">absorbs depth as wait time</text>
  <text x="620" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">no reserved capacity at all</text>
  <g filter="url(#m8l7b-soft)">
    <rect x="830" y="70" width="360" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="830" y="70" width="6" height="90" fill="#64748B" clip-path="url(#m8l7b-k3)"/>
  </g>
  <circle cx="868" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(857.56,104.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="894" y="122" font-size="18.5" font-weight="600" fill="#111827">Batch</text>
  <text x="1010" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">sells the idle overnight hours</text>
  <text x="1010" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">cheapest per image, by far</text>
  <g filter="url(#m8l7b-lift)">
    <rect x="320" y="272" width="600" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="320" y="272" width="9" height="90" fill="#7C3AED" clip-path="url(#m8l7b-k4)"/>
  </g>
  <circle cx="358" cy="317" r="18" fill="#FFFFFF"/>
  <g transform="translate(347.56,306.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="384" y="324" font-size="18.5" font-weight="600" fill="#111827">The same queue mechanism</text>
  <rect x="40" y="404" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="438" font-size="16" fill="#475569">Say all three out loud. Most candidates name the queue and then use it for only one of its jobs.</text>
  <rect x="64" y="464" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="486" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Job one</text>
  <text x="288" y="486" font-size="15.5" fill="#475569">the pricing model: what each tier costs is what each tier waits</text>
  <rect x="64" y="508" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="530" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Job two</text>
  <text x="288" y="530" font-size="15.5" fill="#475569">the autoscaling signal: queue-depth trends drive the warm pool</text>
  <rect x="64" y="552" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="574" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Job three</text>
  <text x="288" y="574" font-size="15.5" fill="#475569">the wait-time experience, which is the product the user actually feels</text>
</svg>