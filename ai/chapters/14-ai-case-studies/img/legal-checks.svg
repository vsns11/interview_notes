<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Verification runs on every answer, and failing claims never render">
  <defs>
    <marker id="m8l5c-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="m8l5c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m8l5c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m8l5c-k1"><rect x="50" y="64" width="204" height="90" rx="12"/></clipPath>
    <clipPath id="m8l5c-k2"><rect x="300" y="64" width="286" height="90" rx="12"/></clipPath>
    <clipPath id="m8l5c-k3"><rect x="632" y="64" width="245" height="90" rx="12"/></clipPath>
    <clipPath id="m8l5c-k4"><rect x="923" y="64" width="265" height="90" rx="12"/></clipPath>
    <clipPath id="m8l5c-k5"><rect x="50" y="236" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="m8l5c-k6"><rect x="650" y="236" width="540" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M254,109 L300,109" marker-end="url(#m8l5c-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M586,109 L632,109" marker-end="url(#m8l5c-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M877,109 L923,109" marker-end="url(#m8l5c-mslate)"/></g>
  <g filter="url(#m8l5c-soft)">
    <rect x="50" y="64" width="204" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="50" y="64" width="6" height="90" fill="#2563EB" clip-path="url(#m8l5c-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">Draft answer</text>
  <text x="152" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">each claim carries a quoted passage</text>
  <g filter="url(#m8l5c-soft)">
    <rect x="300" y="64" width="286" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="300" y="64" width="6" height="90" fill="#4F46E5" clip-path="url(#m8l5c-k2)"/>
  </g>
  <circle cx="338" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,98.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="364" y="116" font-size="18.5" font-weight="600" fill="#111827">Per-claim entailment</text>
  <text x="443" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">does the passage support it?</text>
  <g filter="url(#m8l5c-soft)">
    <rect x="632" y="64" width="245" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="632" y="64" width="6" height="90" fill="#7C3AED" clip-path="url(#m8l5c-k3)"/>
  </g>
  <circle cx="670" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(659.56,98.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="696" y="116" font-size="18.5" font-weight="600" fill="#111827">Citation exists?</text>
  <text x="754.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">does it resolve in the corpus?</text>
  <g filter="url(#m8l5c-soft)">
    <rect x="923" y="64" width="265" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="923" y="64" width="6" height="90" fill="#D97706" clip-path="url(#m8l5c-k4)"/>
  </g>
  <circle cx="961" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(950.56,98.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="987" y="116" font-size="18.5" font-weight="600" fill="#111827">Treatment re-check</text>
  <text x="1055.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">is it still good law right now?</text>
  <g filter="url(#m8l5c-soft)">
    <rect x="50" y="236" width="540" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="50" y="236" width="6" height="90" fill="#DB2777" clip-path="url(#m8l5c-k5)"/>
  </g>
  <circle cx="88" cy="281" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,270.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="114" y="288" font-size="18.5" font-weight="600" fill="#111827">Strip the failing claim</text>
  <text x="320" y="351" font-size="15.5" text-anchor="middle" fill="#6B7280">recheck the remaining conclusion</text>
  <g filter="url(#m8l5c-lift)">
    <rect x="650" y="236" width="540" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="650" y="236" width="9" height="90" fill="#059669" clip-path="url(#m8l5c-k6)"/>
  </g>
  <circle cx="688" cy="281" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,270.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="714" y="288" font-size="18.5" font-weight="600" fill="#111827">Or refuse, with pointers</text>
  <text x="920" y="351" font-size="15.5" text-anchor="middle" fill="#6B7280">"the closest authorities are..."</text>
  <rect x="40" y="392" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="426" font-size="16" fill="#475569">Synchronous, on every single answer, not on a sampled few. That is the trade latency bought.</text>
  <rect x="64" y="452" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="474" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Structural, not behavioral</text>
  <text x="288" y="474" font-size="15.5" fill="#475569">a citation that does not resolve simply cannot be rendered</text>
  <rect x="64" y="496" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="518" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">The quote does the work</text>
  <text x="288" y="518" font-size="15.5" fill="#475569">quotes help attorneys inspect source support</text>
</svg>