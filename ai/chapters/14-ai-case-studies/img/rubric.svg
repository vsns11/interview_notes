<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The five dimensions interviewers grade, pass bar against strong hire">
  <defs>

    <filter id="m8l1c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m8l1c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="630" fill="#FFFFFF"/>


  <text x="180" y="52" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">Dimension</text>
  <text x="520" y="52" font-size="16" font-weight="700" text-anchor="start" fill="#475569">The pass bar</text>
  <text x="850" y="52" font-size="16" font-weight="700" text-anchor="start" fill="#475569">The strong-hire bar</text>
  <rect x="50" y="74" width="260" height="56" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="180" y="108" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Problem navigation</text>
  <text x="520" y="108" font-size="15.5" text-anchor="start" fill="#94A3B8">follows the steps when prompted</text>
  <text x="850" y="108" font-size="15.5" font-weight="600" text-anchor="start" fill="#1D4ED8">drives the clock unprompted</text>
  <rect x="50" y="148" width="260" height="56" rx="8" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="180" y="182" text-anchor="middle" font-size="15.5" font-weight="600" fill="#4338CA">Data and metrics</text>
  <text x="520" y="182" font-size="15.5" text-anchor="start" fill="#94A3B8">names metrics when asked</text>
  <text x="850" y="182" font-size="15.5" font-weight="600" text-anchor="start" fill="#4338CA">numbers arrive without being asked</text>
  <rect x="50" y="222" width="260" height="56" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="180" y="256" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Architecture</text>
  <text x="520" y="256" font-size="15.5" text-anchor="start" fill="#94A3B8">a correct diagram for the family</text>
  <text x="850" y="256" font-size="15.5" font-weight="600" text-anchor="start" fill="#047857">every arrow has a budget and a failure</text>
  <rect x="50" y="296" width="260" height="56" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="180" y="330" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Production maturity</text>
  <text x="520" y="330" font-size="15.5" text-anchor="start" fill="#94A3B8">mentions monitoring when asked</text>
  <text x="850" y="330" font-size="15.5" font-weight="600" text-anchor="start" fill="#B45309">loop, gates, fallbacks arrive unprompted</text>
  <rect x="50" y="370" width="260" height="56" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="180" y="404" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Communication</text>
  <text x="520" y="404" font-size="15.5" text-anchor="start" fill="#94A3B8">organized and understandable</text>
  <text x="850" y="404" font-size="15.5" font-weight="600" text-anchor="start" fill="#5B21B6">closes with loop, risks, and cost stated</text>
  <rect x="40" y="456" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="490" font-size="16" fill="#475569">Grade yourself from a recording or a listener. Memory quietly upgrades your own performance.</text>
  <rect x="64" y="516" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="538" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Your study list</text>
  <text x="288" y="538" font-size="15.5" fill="#475569">any dimension still at the pass bar after two runs in a row</text>
  <rect x="64" y="560" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="582" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Advanced answers</text>
  <text x="288" y="582" font-size="15.5" fill="#475569">connect technical choices to product and operational constraints</text>
</svg>