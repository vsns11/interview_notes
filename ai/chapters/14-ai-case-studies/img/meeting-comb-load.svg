  <rect x="630" y="279" width="46" height="21" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <rect x="700" y="285" width="46" height="15" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <rect x="770" y="110" width="46" height="190" rx="8" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
