  <path d="M56,300 L1180,300" fill="none" stroke="#CBD5E1" stroke-width="2"/>
  <text x="233" y="328" font-size="15.5" font-weight="600" text-anchor="middle" fill="#64748B">2 PM</text>
  <text x="513" y="328" font-size="15.5" font-weight="600" text-anchor="middle" fill="#64748B">3 PM</text>
  <text x="793" y="328" font-size="15.5" font-weight="600" text-anchor="middle" fill="#64748B">4 PM</text>
  <text x="1073" y="328" font-size="15.5" font-weight="600" text-anchor="middle" fill="#64748B">5 PM</text>
  <text x="620" y="358" font-size="16" font-weight="600" text-anchor="middle" fill="#475569">the tall bar is the top of the hour, when the calls all end</text>
  <text x="620" y="382" font-size="15.5" text-anchor="middle" fill="#94A3B8">so the work arrives together, in a burst</text>
  <rect x="40" y="410" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="444" font-size="16" fill="#475569">Naming the shape justifies the entire async design in one image.</text>
  <rect x="64" y="470" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="492" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The queue absorbs it</text>
  <text x="288" y="492" font-size="15.5" fill="#475569">target delivery time, monitor delays, and evaluate correctness</text>
  <rect x="64" y="514" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="536" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Versioned cache</text>
  <text x="288" y="536" font-size="15.5" fill="#475569">reuse within access, freshness, and retention rules</text>
</svg>