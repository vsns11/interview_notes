<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Delivering critique as a plan, not a verdict">
  <defs>
    <marker id="m8l9c-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="m8l9c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m8l9c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m8l9c-k1"><rect x="50" y="70" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="m8l9c-k2"><rect x="440" y="70" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="m8l9c-k3"><rect x="830" y="70" width="360" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M410,115 L440,115" marker-end="url(#m8l9c-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M800,115 L830,115" marker-end="url(#m8l9c-mslate)"/></g>
  <g filter="url(#m8l9c-soft)">
    <rect x="50" y="70" width="360" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="50" y="70" width="6" height="90" fill="#059669" clip-path="url(#m8l9c-k1)"/>
  </g>
  <circle cx="88" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,104.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="122" font-size="18.5" font-weight="600" fill="#111827">Affirm the shape</text>
  <text x="230" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">"RAG is the right pattern here"</text>
  <text x="230" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">the author may be in the room</text>
  <g filter="url(#m8l9c-soft)">
    <rect x="440" y="70" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="440" y="70" width="6" height="90" fill="#2563EB" clip-path="url(#m8l9c-k2)"/>
  </g>
  <circle cx="478" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,104.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="504" y="122" font-size="18.5" font-weight="600" fill="#111827">Consequence and fix</text>
  <text x="620" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">never just a preference</text>
  <text x="620" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">what breaks, and what repairs it</text>
  <g filter="url(#m8l9c-lift)">
    <rect x="830" y="70" width="360" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="830" y="70" width="9" height="90" fill="#7C3AED" clip-path="url(#m8l9c-k3)"/>
  </g>
  <circle cx="868" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(857.56,104.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="894" y="122" font-size="18.5" font-weight="600" fill="#111827">Sequence the work</text>
  <text x="1010" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">blockers, week one, then later</text>
  <text x="1010" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">"what do we do" is the real job</text>
  <rect x="40" y="268" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="302" font-size="16" fill="#475569">A demo is not proof of production readiness; verify controls before rollout.</text>
  <rect x="64" y="328" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="350" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Blockers</text>
  <text x="288" y="350" font-size="15.5" fill="#475569">permission filtering, scoped tools, and the input and action gates</text>
  <rect x="64" y="372" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="394" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Before rollout</text>
  <text x="288" y="394" font-size="15.5" fill="#475569">evaluate, capture feedback, and test fallbacks before rollout</text>
  <rect x="64" y="416" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="438" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Then</text>
  <text x="288" y="438" font-size="15.5" fill="#475569">incremental sync, hybrid retrieval, caching and routing, each paying for itself</text>
  <rect x="40" y="528" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="573" text-anchor="middle" font-size="16" fill="#475569">Treat the author as a colleague being helped, never as a defendant being cross-examined.</text>
</svg>