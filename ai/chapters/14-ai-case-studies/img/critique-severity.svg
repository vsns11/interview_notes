<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Critique in severity order, systems first">
  <defs>

    <filter id="m8l9a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m8l9a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>


  <rect x="50" y="60" width="300" height="58" rx="8" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="200" y="95" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">1. Violated invariants</text>
  <text x="370" y="84" font-size="15.5" text-anchor="start" fill="#6B7280">security, permissions, money</text>
  <text x="370" y="106" font-size="15.5" font-weight="600" text-anchor="start" fill="#BE185D">things that are simply wrong, right now</text>
  <rect x="50" y="138" width="300" height="58" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="200" y="173" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">2. Missing loops</text>
  <text x="370" y="162" font-size="15.5" text-anchor="start" fill="#6B7280">no evals, no feedback capture</text>
  <text x="370" y="184" font-size="15.5" font-weight="600" text-anchor="start" fill="#B45309">things that cannot stay right over time</text>
  <rect x="50" y="216" width="300" height="58" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="200" y="251" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">3. Reliability gaps</text>
  <text x="370" y="240" font-size="15.5" text-anchor="start" fill="#6B7280">no fallbacks, stale indexes</text>
  <text x="370" y="262" font-size="15.5" font-weight="600" text-anchor="start" fill="#5B21B6">things that fail ungracefully</text>
  <rect x="50" y="294" width="300" height="58" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="200" y="329" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">4. Economics</text>
  <text x="370" y="318" font-size="15.5" text-anchor="start" fill="#6B7280">no routing, no caching, no budget</text>
  <text x="370" y="340" font-size="15.5" font-weight="600" text-anchor="start" fill="#1D4ED8">things that will not survive scale</text>
  <rect x="50" y="372" width="300" height="58" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="407" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">5. Quality</text>
  <text x="370" y="396" font-size="15.5" text-anchor="start" fill="#6B7280">reranking, hybrid, rewriting</text>
  <text x="370" y="418" font-size="15.5" font-weight="600" text-anchor="start" fill="#047857">things that could simply be better</text>
  <rect x="40" y="456" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="490" font-size="16" fill="#475569">The order you speak in tells the interviewer your level, before the content does.</text>
  <rect x="64" y="516" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="538" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The tell</text>
  <text x="288" y="538" font-size="15.5" fill="#475569">opening with "I would use a different vector database" inverts the order completely</text>
  <rect x="64" y="560" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="582" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">The discipline</text>
  <text x="288" y="582" font-size="15.5" fill="#475569">hold your most interesting technical opinion until the invariants are named</text>
</svg>