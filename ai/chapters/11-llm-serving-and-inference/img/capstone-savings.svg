<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="612" viewBox="0 0 1240 612" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three standard mechanisms take about 80 percent off the bill">
  <defs>

    <filter id="m4l7b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m4l7b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="612" fill="#FFFFFF"/>


  <text x="50" y="114" font-size="16.5" font-weight="600" text-anchor="start" fill="#111827">Everything on the frontier model</text>
  <rect x="360" y="80" width="700" height="52" rx="8" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="1076" y="113" font-size="16.5" font-weight="600" text-anchor="start" fill="#BE185D">$44,400/day</text>
  <text x="50" y="194" font-size="16.5" font-weight="600" text-anchor="start" fill="#111827">Route 75% to a small model</text>
  <rect x="360" y="160" width="233" height="52" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="609" y="193" font-size="16.5" font-weight="600" text-anchor="start" fill="#B45309">$14,430/day</text>
  <text x="50" y="274" font-size="16.5" font-weight="600" text-anchor="start" fill="#111827">Add prefix and prompt caching</text>
  <rect x="360" y="240" width="163" height="52" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="539" y="273" font-size="16.5" font-weight="600" text-anchor="start" fill="#1D4ED8">$10,042.50/day</text>
  <text x="50" y="354" font-size="16.5" font-weight="600" text-anchor="start" fill="#111827">Add 15% result-cache hits</text>
  <rect x="360" y="320" width="140" height="52" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="516" y="353" font-size="16.5" font-weight="600" text-anchor="start" fill="#047857">$8,536.13/day</text>
  <rect x="40" y="420" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="454" font-size="16" fill="#475569">Attach arithmetic to every step, and state each assumption as adjustable while you say it.</text>
  <rect x="64" y="480" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="502" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The total</text>
  <text x="288" y="502" font-size="15.5" fill="#475569">80.8% lower model charges, under the stated assumptions</text>
  <rect x="64" y="524" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="546" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Stay adjustable</text>
  <text x="288" y="546" font-size="15.5" fill="#475569">25% cache hits give about $7,532/day before other costs</text>
</svg>