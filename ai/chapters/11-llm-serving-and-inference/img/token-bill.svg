<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="452" viewBox="0 0 1240 452" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The token bill, worked in three moves">
  <defs>
    <marker id="m4l3b-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="m4l3b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m4l3b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m4l3b-k1"><rect x="50" y="64" width="245" height="90" rx="12"/></clipPath>
    <clipPath id="m4l3b-k2"><rect x="467" y="64" width="255" height="90" rx="12"/></clipPath>
    <clipPath id="m4l3b-k3"><rect x="894" y="64" width="296" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="452" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M295,109 L467,109" marker-end="url(#m4l3b-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M722,109 L894,109" marker-end="url(#m4l3b-mslate)"/></g>
  <g filter="url(#m4l3b-soft)">
    <rect x="50" y="64" width="245" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="50" y="64" width="6" height="90" fill="#4F46E5" clip-path="url(#m4l3b-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">1. Size the unit</text>
  <text x="172.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">6.5K in, 0.5K out</text>
  <text x="172.5" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">a 10-page document</text>
  <g filter="url(#m4l3b-soft)">
    <rect x="467" y="64" width="255" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="467" y="64" width="6" height="90" fill="#7C3AED" clip-path="url(#m4l3b-k2)"/>
  </g>
  <circle cx="505" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(494.56,98.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="531" y="116" font-size="18.5" font-weight="600" fill="#111827">2. Price the unit</text>
  <text x="594.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">about $0.026 a document</text>
  <text x="594.5" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">at the assumed rates</text>
  <g filter="url(#m4l3b-lift)">
    <rect x="894" y="64" width="296" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="894" y="64" width="9" height="90" fill="#059669" clip-path="url(#m4l3b-k3)"/>
  </g>
  <circle cx="932" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(921.56,98.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="958" y="116" font-size="18.5" font-weight="600" fill="#111827">3. Multiply by volume</text>
  <text x="1042" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">200K a day, about $5,200</text>
  <text x="1042" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">roughly $1.9M a year</text>
  <rect x="40" y="260" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="294" font-size="16" fill="#475569">The number has to produce a decision. That is the whole point of doing the math.</text>
  <rect x="64" y="320" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="342" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Say the conclusion</text>
  <text x="288" y="342" font-size="15.5" fill="#475569">test a smaller model, then measure quality and savings</text>
  <rect x="64" y="364" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="386" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The chat trap</text>
  <text x="288" y="386" font-size="15.5" fill="#475569">full-history requests grow unless context is managed</text>
</svg>