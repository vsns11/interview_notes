<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="886" viewBox="0 0 1240 886" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three shelves of optimizations, learned in order">
  <defs>

