  <text x="999" y="162" font-size="18.5" font-weight="600" fill="#111827">Shorter prompts</text>
  <text x="1052.5" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">trim boilerplate, summarize history</text>
  <g filter="url(#m4l4a-soft)">
