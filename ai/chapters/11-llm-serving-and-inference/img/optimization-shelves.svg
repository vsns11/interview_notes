  <g transform="translate(504.56,624.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.9L18.8 9.8l-4.9 1.9L12 16.6l-1.9-4.9L5.2 9.8l4.9-1.9z"/><path d="M18.5 15.5l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z"/></g>
  <text x="541" y="642" font-size="18.5" font-weight="600" fill="#111827">Distillation</text>
  <text x="579" y="705" font-size="15.5" text-anchor="middle" fill="#6B7280">a small model imitates a large one</text>
  <g filter="url(#m4l4a-soft)">
    <rect x="884" y="590" width="286" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
