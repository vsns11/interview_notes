  <text x="551" y="162" font-size="18.5" font-weight="600" fill="#111827">Router or cascade</text>
  <text x="614.5" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">route validated tasks to a cheaper model</text>
  <g filter="url(#m4l4a-soft)">
    <rect x="935" y="110" width="235" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
