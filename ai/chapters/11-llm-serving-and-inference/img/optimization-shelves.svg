  <g transform="translate(911.56,624.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="948" y="642" font-size="18.5" font-weight="600" fill="#111827">Speculative decoding</text>
  <text x="1027" y="705" font-size="15.5" text-anchor="middle" fill="#6B7280">a draft model proposes, the big one checks</text>
  <rect x="40" y="770" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="815" text-anchor="middle" font-size="16" fill="#475569">Choose using measured savings and quality. Every replacement must meet the product's requirements.</text>
</svg>