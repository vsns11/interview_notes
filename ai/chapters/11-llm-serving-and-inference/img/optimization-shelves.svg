    <rect x="70" y="350" width="6" height="90" fill="#4F46E5" clip-path="url(#m4l4a-k4)"/>
  </g>
  <circle cx="108" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,384.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="134" y="402" font-size="18.5" font-weight="600" fill="#111827">Continuous batching</text>
  <text x="208" y="465" font-size="15.5" text-anchor="middle" fill="#6B7280">admit and retire per decode step</text>
  <g filter="url(#m4l4a-soft)">
    <rect x="534" y="350" width="224" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
