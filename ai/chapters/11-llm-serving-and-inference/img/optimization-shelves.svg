  <text x="134" y="642" font-size="18.5" font-weight="600" fill="#111827">Quantization</text>
  <text x="172" y="705" font-size="15.5" text-anchor="middle" fill="#6B7280">fewer bits per number</text>
  <g filter="url(#m4l4a-soft)">
    <rect x="477" y="590" width="204" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
