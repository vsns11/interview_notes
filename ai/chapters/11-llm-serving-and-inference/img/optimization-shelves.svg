  <g transform="translate(561.56,384.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="598" y="402" font-size="18.5" font-weight="600" fill="#111827">Paged KV cache</text>
  <text x="646" y="465" font-size="15.5" text-anchor="middle" fill="#6B7280">small blocks, handed out on demand</text>
  <g filter="url(#m4l4a-soft)">
    <rect x="946" y="350" width="224" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="946" y="350" width="6" height="90" fill="#4F46E5" clip-path="url(#m4l4a-k6)"/>
  </g>
  <circle cx="984" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(973.56,384.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="1010" y="402" font-size="18.5" font-weight="600" fill="#111827">Prefix caching</text>
  <text x="1058" y="465" font-size="15.5" text-anchor="middle" fill="#6B7280">skip prefill on the shared start</text>
  <g filter="url(#m4l4a-soft)">
    <rect x="70" y="590" width="204" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
