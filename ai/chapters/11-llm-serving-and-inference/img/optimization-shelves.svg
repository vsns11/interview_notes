  </g>
  <circle cx="108" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,144.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="134" y="162" font-size="18.5" font-weight="600" fill="#111827">Semantic cache</text>
  <text x="182" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">match by meaning, not exact text</text>
  <g filter="url(#m4l4a-soft)">
    <rect x="487" y="110" width="255" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
