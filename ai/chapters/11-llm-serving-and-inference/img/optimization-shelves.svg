      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m4l4a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m4l4a-k1"><rect x="70" y="110" width="224" height="90" rx="12"/></clipPath>
    <clipPath id="m4l4a-k2"><rect x="487" y="110" width="255" height="90" rx="12"/></clipPath>
    <clipPath id="m4l4a-k3"><rect x="935" y="110" width="235" height="90" rx="12"/></clipPath>
    <clipPath id="m4l4a-k4"><rect x="70" y="350" width="276" height="90" rx="12"/></clipPath>
    <clipPath id="m4l4a-k5"><rect x="534" y="350" width="224" height="90" rx="12"/></clipPath>
    <clipPath id="m4l4a-k6"><rect x="946" y="350" width="224" height="90" rx="12"/></clipPath>
    <clipPath id="m4l4a-k7"><rect x="70" y="590" width="204" height="90" rx="12"/></clipPath>
    <clipPath id="m4l4a-k8"><rect x="477" y="590" width="204" height="90" rx="12"/></clipPath>
    <clipPath id="m4l4a-k9"><rect x="884" y="590" width="286" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="886" fill="#FFFFFF"/>
  <rect x="40" y="50" width="1160" height="210" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="80" font-size="16.5" font-weight="600" fill="#047857">Shelf one: do not call the big model at all</text>
  <rect x="40" y="290" width="1160" height="210" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="320" font-size="16.5" font-weight="600" fill="#4338CA">Shelf two: inside the serving engine</text>
  <rect x="40" y="530" width="1160" height="210" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="560" font-size="16.5" font-weight="600" fill="#5B21B6">Shelf three: change what the model computes</text>

  <g filter="url(#m4l4a-soft)">
    <rect x="70" y="110" width="224" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
