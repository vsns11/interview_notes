<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="672" viewBox="0 0 1240 672" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Continuous batching refills a slot the moment a request finishes">
  <defs>

    <filter id="m4l4b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m4l4b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="672" fill="#FFFFFF"/>


  <text x="50" y="90" font-size="16.5" font-weight="600" text-anchor="start" fill="#111827">Naive batching</text>
  <text x="50" y="116" font-size="15.5" text-anchor="start" fill="#6B7280">the whole batch waits</text>
  <rect x="300" y="76" width="300" height="30" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="600" y="76" width="590" height="30" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="895" y="97" text-anchor="middle" font-size="15.5" fill="#94A3B8">slot idle, but held</text>
  <rect x="300" y="118" width="520" height="30" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="820" y="118" width="370" height="30" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1005" y="139" text-anchor="middle" font-size="15.5" fill="#94A3B8">slot idle, but held</text>
  <rect x="300" y="160" width="380" height="30" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="680" y="160" width="510" height="30" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="935" y="181" text-anchor="middle" font-size="15.5" fill="#94A3B8">slot idle, but held</text>
  <rect x="300" y="202" width="890" height="30" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="745" y="223" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">the slowest request</text>
  <g stroke="#DB2777" stroke-width="2" stroke-dasharray="6 5" fill="none"><path d="M1190,64 V244"/></g>
  <text x="1100" y="276" font-size="15.5" font-weight="600" text-anchor="middle" fill="#BE185D">batch ends here</text>
  <text x="50" y="366" font-size="16.5" font-weight="600" text-anchor="start" fill="#111827">Continuous batching</text>
  <text x="50" y="392" font-size="15.5" text-anchor="start" fill="#6B7280">admitted and retired per token</text>
  <rect x="300" y="352" width="300" height="30" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="600" y="352" width="340" height="30" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <rect x="940" y="352" width="250" height="30" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <rect x="300" y="394" width="520" height="30" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="820" y="394" width="370" height="30" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <rect x="300" y="436" width="380" height="30" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="680" y="436" width="300" height="30" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <rect x="980" y="436" width="210" height="30" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <rect x="300" y="478" width="890" height="30" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="745" y="499" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">still running</text>
  <text x="720" y="528" font-size="15.5" font-weight="600" text-anchor="middle" fill="#047857">new requests can use capacity released by completed ones</text>
  <rect x="40" y="556" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="601" text-anchor="middle" font-size="16" fill="#475569">Measure throughput and latency together; the gain depends on the workload and scheduler.</text>
</svg>